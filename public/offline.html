<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>تحتاج اتصال إنترنت — منجز</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E7C66" />
    <style>
      body { font-family: "Tajawal", system-ui, -apple-system, sans-serif; background: #F7F7F2; color: #1a1a1a; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1.5rem; }
      .card { max-width: 22rem; width: 100%; text-align: center; background: #fff; border: 1px solid #e5e5dd; border-radius: 1rem; padding: 2rem 1.25rem; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
      .icon { width: 56px; height: 56px; border-radius: 14px; background: #0E7C66; color: #fff; display: grid; place-items: center; margin: 0 auto 1rem; font-size: 28px; font-weight: 700; }
      h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
      p { color: #555; margin: 0 0 1.25rem; font-size: .95rem; line-height: 1.6; }
      button { width: 100%; padding: .75rem 1rem; border-radius: .75rem; background: #0E7C66; color: #fff; font: inherit; font-weight: 700; border: 0; cursor: pointer; }
      .hint { margin-top: .75rem; font-size: .75rem; color: #888; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">م</div>
      <h1>تحتاج اتصال إنترنت</h1>
      <p>منجز يحتاج إنترنت لحفظ العمليات المالية (البيع، التحصيل، التسوية). تحقّق من اتصالك وأعد المحاولة.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
      <div class="hint">لا يتم حفظ أي عملية محليًا أثناء انقطاع الإنترنت.</div>
    </div>
  </body>
</html>
