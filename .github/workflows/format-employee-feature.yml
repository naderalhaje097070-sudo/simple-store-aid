name: Format Employee Feature

on:
  push:
    branches:
      - feature/employee-accounts-custody-v1
    paths:
      - "src/features/employees/**"
      - "src/features/settings/SettingsScreen.tsx"
      - "src/routes/_authenticated/employee.tsx"
      - "src/routes/_authenticated/employees.tsx"
      - "src/routes/_authenticated/route.tsx"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/employee-accounts-custody-v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"
      - run: bun install --frozen-lockfile
      - name: Format feature files
        run: |
          bunx prettier --write \
            src/features/employees/*.ts \
            src/features/employees/*.tsx \
            src/features/settings/SettingsScreen.tsx \
            src/routes/_authenticated/employee.tsx \
            src/routes/_authenticated/employees.tsx \
            src/routes/_authenticated/route.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/employees src/features/settings/SettingsScreen.tsx \
            src/routes/_authenticated/employee.tsx \
            src/routes/_authenticated/employees.tsx \
            src/routes/_authenticated/route.tsx
          git commit -m "style: format employee account feature"
          git push origin HEAD:feature/employee-accounts-custody-v1
