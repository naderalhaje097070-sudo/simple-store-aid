name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check reviewed generated source formatting
        run: bun run format:generated -- --check
      - name: Typecheck
        run: bun run typecheck
      - name: Lint changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' || true)
          printf '%s\n' "${files[@]}" | tee /tmp/lint-files.txt
          if (( ${#files[@]} == 0 )); then
            echo "No changed JavaScript or TypeScript files to lint."
            exit 0
          fi
          set -o pipefail
          bunx eslint "${files[@]}" 2>&1 | tee /tmp/lint.log
      - name: Unit tests
        run: bun run test:unit
      - name: Offline server environment boundary
        run: bun tests/gate4/sec-env/server-boundary.ts
      - name: Setup Python for browser containment regression
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned browser test tooling
        run: |
          python -m pip install -r tests/gate4/sec-env/requirements.txt
          python -m playwright install chromium --only-shell --with-deps
      - name: Verify browser redirect, WebSocket and origin containment
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/gate4/sec-env/browser-network.py
      - name: Build from mode-specific env file
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .env.sec-env-contract' EXIT
          cat > .env.sec-env-contract <<'EOF'
          MONGEZZ_DEPLOY_TARGET=ci
          VITE_SUPABASE_URL=http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY=quality-env-file-placeholder
          VITE_SUPABASE_PROJECT_ID=quality-env-file
          EOF

          env \
            -u MONGEZZ_DEPLOY_TARGET \
            -u VITE_SUPABASE_URL \
            -u VITE_SUPABASE_PUBLISHABLE_KEY \
            -u VITE_SUPABASE_PROJECT_ID \
            bunx vite build --mode sec-env-contract
      - name: Build
        env:
          MONGEZZ_DEPLOY_TARGET: ci
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: quality-build-placeholder
          VITE_SUPABASE_PROJECT_ID: quality-build
        run: bun run build
      - name: Verify generation leaves tracked application files intact
        run: git diff --exit-code --
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            /tmp/lint-files.txt
            /tmp/lint.log
          if-no-files-found: warn

