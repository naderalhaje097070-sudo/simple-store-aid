name: Release financial acceptance
# One workflow for the release candidate. The release gate replaces the chained
# per-stage source manifests; the behavioural suites run unchanged against a
# database built from the gate-verified migrations.
#   fresh   : every candidate migration on an empty stack
#   upgrade : origin/main's migrations, seeded through main's own RPCs, then
#             upgraded to the candidate (the transition production will take)
#   populated: every candidate migration, with a prior tenant seeded first whose
#             money and stock must stay unchanged (collection and sale suites)
on:
  # Every push: no path filter, so no change (app config included) skips acceptance.
  push:
    branches: ["integration/g0-g1-reconcile-2026-10-18"]
  # Required financial acceptance on PRs into main OR integration. No path filter:
  # all PRs produce each matrix check; PR code runs with read-only permissions.
  pull_request:
    branches: [main, integration/g0-g1-reconcile-2026-10-18]
  workflow_dispatch:
permissions:
  contents: read
env:
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  SUPABASE_HOME: /tmp/monjez-c5-disabled-cli
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [collection, sale, journey, quantity]
        mode: [fresh, upgrade, populated]
        # populated keeps the prior-tenant controls the old c4-sale and
        # stored-finance workflows ran; the journey suite has no such branch.
        # quantity (old c2 stage): its durable fractional-stock, rejection and
        # denial controls on the candidate; its upgrade phase reproduced a
        # pre-fix bug on a 50-migration state and is not a release property.
        exclude:
          - suite: journey
            mode: populated
          - suite: quantity
            mode: upgrade
          - suite: quantity
            mode: populated
    env:
      EXPECTED_SOURCE: ${{ github.sha }}
      CONTRACT_MODE: ${{ matrix.mode }}
      SUITE: ${{ matrix.suite }}
    steps:
      - name: Disable telemetry before CLI setup
        run: |
          mkdir -p "$SUPABASE_HOME"
          echo '{"enabled":false,"consent":"denied","schema_version":1,"device_id":"00000000-0000-4000-8000-000000000001","session_id":"00000000-0000-4000-8000-000000000002","session_last_active":"2026-10-28T00:00:00Z"}' > "$SUPABASE_HOME/telemetry.json"
          chmod 600 "$SUPABASE_HOME/telemetry.json"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"
      - name: Frozen current dependencies before credentials
        run: bun install --frozen-lockfile
      - name: Release gate before credentials
        run: |
          python tests/release/test_gate.py
          python tests/release/gate.py
      - name: Suite source checks and build before credentials
        shell: bash
        run: |
          set -euo pipefail
          case "$SUITE" in
            collection)
              python tests/c5-finance/test_verdict.py
              node tests/c5-collection/native-hook.cjs --preflight
              node --test tests/c5-collection/contracts.test.cjs
              node tests/c5-collection/browser-build.mjs /tmp/monjez-c5sale-browser ;;
            sale)
              node --test tests/c4-sale/contracts.test.cjs
              node tests/c4-sale/build.mjs /tmp/monjez-c4-browser
              node tests/auth-signup/build.mjs /tmp/monjez-auth-signup-browser ;;
            journey)
              node --test tests/c5-journey/profit-report.test.ts
              node tests/c5-journey/build.mjs /tmp/monjez-c5sale-browser ;;
            quantity)
              node tests/c2-quantity/quantity.test.mjs ;;
          esac
      - name: Discover pinned CLI operations
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/supabase/.temp/cli-latest"
          mkdir -p "$RUNNER_TEMP/cli-probe" && cd "$RUNNER_TEMP/cli-probe"
          supabase telemetry status > "$RUNNER_TEMP/telemetry-status.txt"
          grep -q "Telemetry is disabled" "$RUNNER_TEMP/telemetry-status.txt"
          test "$(supabase --version)" = '2.101.0'
          supabase migration up --help > "$RUNNER_TEMP/up-help.txt"
          supabase db advisors --help > "$RUNNER_TEMP/advisors-help.txt"
          supabase stop --help > "$RUNNER_TEMP/stop-help.txt"
          supabase gen types --help > "$RUNNER_TEMP/types-help.txt"
          grep -q -- '--include-all' "$RUNNER_TEMP/up-help.txt"
          grep -q -- '--no-backup' "$RUNNER_TEMP/stop-help.txt"
          grep -q -- '--local' "$RUNNER_TEMP/types-help.txt"
          test ! -e "$GITHUB_WORKSPACE/supabase/.temp/cli-latest"
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client iptables > "$RUNNER_TEMP/prerequisites.log" 2>&1
      - name: Pinned browser before credentials
        run: |
          python -m pip install -r tests/gate4/sec-env/requirements.txt > "$RUNNER_TEMP/browser-install.log" 2>&1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/collection-playwright python -m playwright install chromium --only-shell --with-deps >> "$RUNNER_TEMP/browser-install.log" 2>&1
          chmod -R a+rX /tmp/collection-playwright
      - name: Database-free browser regressions before credentials
        # Kept from the old c4-sale browser job and the c5-journey selector contract.
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/collection-playwright
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          case "$SUITE" in
            sale)    python tests/c4-sale/browser.py /tmp/monjez-c4-browser && python tests/c4-sale/quantity_input.py /tmp/monjez-c4-browser && python tests/c4-sale/inactive_product.py /tmp/monjez-c4-browser && python tests/c4-sale/autofocus_race.py /tmp/monjez-c4-browser && python tests/auth-signup/browser.py /tmp/monjez-auth-signup-browser ;;
            journey) python tests/c5-journey/browser.py ;;
            collection|quantity) echo "RELEASE_BROWSER_REGRESSION none for $SUITE" ;;
          esac
      - name: Restrict probe UID before credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin c5finance
          uid="$(id -u c5finance)"
          sudo iptables -N C5F
          sudo iptables -A C5F -o lo -d 127.0.0.1/32 -p tcp -m multiport --dports 54321,54322,4173 -j ACCEPT
          sudo iptables -A C5F -o lo -s 127.0.0.1/32 -d 127.0.0.1/32 -p tcp --sport 4173 -m conntrack --ctstate ESTABLISHED -j ACCEPT
          sudo iptables -A C5F -j REJECT --reject-with icmp-port-unreachable
          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$uid" -j C5F
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner "$uid" -j REJECT
          sudo -u c5finance "$(command -v python)" - <<'PY'
          import socket
          try:
              with socket.create_connection(('1.1.1.1',443),timeout=3): pass
          except OSError:
              print('C5F_CREDENTIAL_FREE_EGRESS_REJECTED')
          else:
              raise SystemExit('C5F_FIREWALL_FAILED')
          PY
          sudo install -d -m 711 -o c5finance -g c5finance /tmp/monjez-c5sale
          sudo cp -a "$GITHUB_WORKSPACE/." /tmp/monjez-c5sale/repo
          sudo install -d -m 700 -o c5finance -g c5finance /tmp/monjez-c5sale/evidence
          if [[ -d /tmp/monjez-c5sale-browser ]]; then sudo cp -a /tmp/monjez-c5sale-browser /tmp/monjez-c5sale/browser; fi
          sudo chown -R c5finance:c5finance /tmp/monjez-c5sale
          sudo iptables -nvxL C5F > "$RUNNER_TEMP/firewall-before.txt"
      - name: Start disposable stack
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stack="$RUNNER_TEMP/monjez-c5sale-stack"
          mkdir -p "$stack/supabase/migrations"
          supabase --workdir "$stack" init > "$RUNNER_TEMP/init-private.log" 2>&1
          if [[ "$CONTRACT_MODE" == upgrade ]]; then
            # Production-shaped start: exactly the migrations already on main.
            mkdir -p "$RUNNER_TEMP/main-migrations"
            git archive origin/main supabase/migrations | tar -x -C "$RUNNER_TEMP/main-migrations"
            cp "$RUNNER_TEMP/main-migrations/supabase/migrations/"*.sql "$stack/supabase/migrations/"
          else
            cp supabase/migrations/*.sql "$stack/supabase/migrations/"
          fi
          echo "RELEASE_STACK_MIGRATIONS $(ls "$stack/supabase/migrations" | wc -l)"
          if ! supabase --workdir "$stack" start > "$RUNNER_TEMP/start-private.log" 2>&1; then
            echo 'RELEASE_STACK_START_FAILURE_PRIVATE_LOG_WITHHELD'
            exit 1
          fi
          supabase --workdir "$stack" status -o json > "$RUNNER_TEMP/status-private.json"
          sudo install -m 600 -o c5finance -g c5finance "$RUNNER_TEMP/status-private.json" /tmp/monjez-c5sale/status.json
      - name: Seed on main, upgrade to candidate, verify financial facts
        if: matrix.mode == 'upgrade'
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            (cd /tmp/monjez-c5sale/repo && sudo -u c5finance env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 \
              EXPECTED_SOURCE="$EXPECTED_SOURCE" CONTRACT_MODE="$CONTRACT_MODE" MONGEZZ_DEPLOY_TARGET=ci MONGEZZ_E2E_WRITE_TEST=1 CI_ISOLATED_SUPABASE=1 \
              VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY=c5finance-preflight-placeholder \
              PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres \
              python tests/release/upgrade.py "$1" --expected-source "$EXPECTED_SOURCE" \
                --status-file /tmp/monjez-c5sale/status.json --evidence-dir /tmp/monjez-c5sale/evidence \
                --private-state /tmp/monjez-c5sale/private-state.json)
          }
          probe seed
          cp supabase/migrations/*.sql "$RUNNER_TEMP/monjez-c5sale-stack/supabase/migrations/"
          supabase --workdir "$RUNNER_TEMP/monjez-c5sale-stack" migration up --local --include-all > "$RUNNER_TEMP/upgrade-private.log" 2>&1 \
            || { echo 'RELEASE_UPGRADE_MIGRATION_FAILED_PRIVATE_LOG_WITHHELD'; exit 1; }
          probe verify
      - name: Generated report types match the candidate database
        if: matrix.suite == 'journey'
        run: |
          supabase --workdir "$RUNNER_TEMP/monjez-c5sale-stack" gen types --local --lang typescript --schema public > "$RUNNER_TEMP/generated-types.ts"
          node tests/c5-journey/profit-types.cjs "$RUNNER_TEMP/generated-types.ts" "$RUNNER_TEMP/profit-types.json"
      - name: Catalog guard on the candidate database (C-DEFPRIV-01)
        # Read-only rules plus negative and compatibility controls, each inside a rolled-back
        # transaction. Runs once per mode on the collection job (fresh, upgrade, populated).
        if: matrix.suite == 'collection'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monjez-c5sale/repo
          sudo -u c5finance env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 CI_ISOLATED_SUPABASE=1 \
            PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres \
            python -I tests/catalog-guard/guard.py /tmp/monjez-c5sale/evidence
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/monjez-c5sale/evidence/catalog-guard.json').read_text())['controls']
          neg=['R1_owner','R2_no_rls','R2_rls_without_live_actor','R2_permissive_live_actor',
               'R2_column_only_authenticated','R2_column_only_anon_insert','R2_live_actor_misses_column_role',
               'R2b_column_readable_view','R2_live_actor_wrong_role','R2_live_actor_select_only','R2_live_actor_or_true',
               'R2_live_actor_other_function','R2_live_actor_without_check',
               'R2c_open_permissive_on_real_table','R2c_open_permissive_public_role','R2b_definer_view',
               'R3_anon_function','R3_allowlisted_name_other_args','R3_public_grant','R4_truncate',
               'R5_definer_no_search_path','R5b_client_writable_schema','R5b_pg_temp_first','R5b_dollar_user',
               'R5b_missing_schema','R8_sql_calls_ungranted','R8_sql_calls_ungranted_unqualified','R8_overload_ungranted','R9_queue_function_granted_to_authenticated','R9_queue_function_revoked_from_service','R9_queue_function_drifted_overload','R9_queue_function_dropped',
               'R6_default_public_execute','R6_default_truncate','R6_default_anon','R7_policy_helper_without_grant']
          required={'baseline_no_violations','nothing_persisted',
                    'compat_new_public_function_not_anon_but_authenticated_and_service',
                    'compat_new_private_function_needs_explicit_grant',
                    'R5c_no_new_definer_with_implicit_pg_temp','negative_R5c_new_implicit_pg_temp_detected',
                    'R7_operational_policy_expressions_as_authenticated',
                    'negative_R7_nested_helper_static_miss_operational_hit',
                    'R2d_permissive_policies_match_reviewed_manifest','negative_R2d_effectively_open_policy_detected',
                    'negative_R2d_widened_existing_policy_detected','R7b_policy_functions_match_reviewed_list',
                    'negative_R7b_new_policy_helper_detected',
                    'positive_R2_column_only_protected_table_accepted','R7c_policy_expressions_representative_rows',
                    'negative_R7c_strict_nested_helper_null_miss_representative_hit',
                    'positive_R7c_strict_nested_helper_granted_passes',
                    'R7b_every_listed_helper_names_passing_guard_controls','negative_R7b_missing_coverage_rejected',
                    'negative_R7b_unknown_control_rejected'}|{'negative_'+n+'_detected' for n in neg}
          passed={r['name'] for r in rows if r.get('passed')}
          print('RELEASE_CATALOG_GUARD '+json.dumps({'controls':len(rows),'missing':sorted(required-passed),
                'failed':sorted(r['name'] for r in rows if not r.get('passed'))}))
          assert len(required)==56 and required<=passed and all(r.get('passed') for r in rows)
          PY
      - name: Behavioural suite against the real stack
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          case "$SUITE" in
            collection) script=tests/c5-collection/native.py ;;
            sale)       script=tests/c4-sale/native.py ;;
            journey)    script=tests/c5-journey/native.py ;;
            quantity)   script=tests/c2-quantity/probe.py; extra=(--phase after) ;;
          esac
          cd /tmp/monjez-c5sale/repo
          sudo -u c5finance env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 PLAYWRIGHT_BROWSERS_PATH=/tmp/collection-playwright \
            MONJEZ_RELEASE_TARGET=1 EXPECTED_SOURCE="$EXPECTED_SOURCE" CONTRACT_MODE="$CONTRACT_MODE" \
            MONGEZZ_DEPLOY_TARGET=ci MONGEZZ_E2E_WRITE_TEST=1 CI_ISOLATED_SUPABASE=1 \
            VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY=c5finance-preflight-placeholder \
            PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres \
            python "$script" --expected-source "$EXPECTED_SOURCE" \
              --status-file /tmp/monjez-c5sale/status.json --evidence-dir /tmp/monjez-c5sale/evidence \
              --private-state /tmp/monjez-c5sale/private-state.json "${extra[@]}"
      - name: Required controls actually executed and passed
        shell: bash
        run: |
          set -euo pipefail
          sudo SUITE="$SUITE" CONTRACT_MODE="$CONTRACT_MODE" python3 - <<'PY'
          import json,os
          from pathlib import Path
          suite,mode=os.environ['SUITE'],os.environ['CONTRACT_MODE']
          files={'collection':'financial-result.json','sale':'client.json','journey':'journey-result.json',
                 'quantity':'quantity-after.json'}
          data=json.loads((Path('/tmp/monjez-c5sale/evidence')/files[suite]).read_text())
          rows=data.get('controls') or data.get('checks') or []
          passed={r['name'] for r in rows if r.get('passed')}
          # Minimum per suite in every mode: a suite that silently skips its core
          # money, stock, idempotency, concurrency or permission proofs fails here.
          core={'collection':{'real_hook_single_stored_collection','parallel_fresh_key_exactly_one_effect',
                              'keyed_only_acl_and_existing_ledger_rls','settlement_retry_no_second_cash',
                              'concurrent_same_sale_key_exactly_one_effect','concurrent_collection_cannot_exceed_total',
                              'lost_reply_first_commit_persisted_once','previously_authorized_staff_banned'},
                'sale':{'lost_no_second_stored_effect','null_no_second_stored_effect','parallel_one_financial_effect',
                        'exact_fractional_stock_after_three_logical_sales','actual_foreign_product_rejected_atomically'},
                'journey':{f'{v}_{c}' for v in ('desktop','mobile') for c in
                           ('quarter_first_committed_cash_stock','quarter_reload_same_key_payload_actor_one_effect',
                            'partial_reload_same_key_payload_one_effect','settlement_cash_once',
                            'return_exact_stock_no_cash_debt_custody','final_day_close_independent_oracle',
                            'final_saved_gross135_net130','browser_no_external_or_script_error')}
                          |{'profit_invoker_select_only_catalog','profit_anon_API_denied','profit_anon_SQL_no_privilege',
                            'profit_denials_all_base_rows_unchanged','profit_inactive_SQL_no_rows',
                            'profit_unaffected_staff_still_allowed','populated_foreign_financial_rows_unchanged'},
                'quantity':{'release_history_matches_gate','uncoerced_decimal_quantity_columns',
                            'stored_four_quarters_equal_one_unit_and_100_cash','rejection_atomic_0.001',
                            'reject_invalid_quantity_NaN','reject_invalid_stock_-0.25','foreign_denial_atomic',
                            'concurrent_fractional_stock_exact','delete_restores_exact_quarter',
                            'return_restores_exact_quarter','old_banned_token_rejected','banned_denial_atomic'}}[suite]
          required=core|{('collection','populated'):{'nonempty_prior_tenant_seed','populated_prior_tenant_unchanged'},
                         ('sale','populated'):{'nonempty_prior_quarter_sale'}}.get((suite,mode),set())
          if mode=='upgrade':
              required|={'upgrade_starts_exactly_at_main_history','main_seed_matches_independent_oracle',
                         'main_seed_relations_recorded','upgraded_history_is_exactly_candidate',
                         'upgraded_all_base_relations_preserved','upgraded_financial_facts_preserved',
                         'upgraded_saved_close_reads_margin84_net79','upgraded_old_debt_settles_exactly_once'}
              upgrade=json.loads(Path('/tmp/monjez-c5sale/evidence/upgrade-verify.json').read_text())
              passed|={r['name'] for r in upgrade['controls'] if r.get('passed')}
          missing=sorted(required-passed)
          # Defensive: every recorded row must have passed, not only the named ones,
          # independently of the suite stopping at its first failure.
          failed=sorted({r.get('name','?') for r in rows if not r.get('passed')})
          if mode=='upgrade':
              failed+=sorted({r.get('name','?') for r in upgrade['controls'] if not r.get('passed')})
          print('RELEASE_REQUIRED_CONTROLS '+json.dumps({'suite':suite,'mode':mode,'controls':len(rows),'required':sorted(required),'missing':missing,'failed':failed}))
          assert rows and not missing and not failed
          PY
      - name: Paddle webhook does not wait on a concurrent sale's tenant lock
        # C-PADDLE-01: two real sessions on the candidate stack; synthetic rows only,
        # removed by the probe. Runs once per mode on the collection job.
        if: matrix.suite == 'collection'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monjez-c5sale/repo
          sudo -u c5finance env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 CI_ISOLATED_SUPABASE=1 \
            PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres \
            python -I tests/billing-lock/probe.py /tmp/monjez-c5sale/evidence
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/monjez-c5sale/evidence/billing-lock.json').read_text())['controls']
          required={'catalog_tenant_lock_is_no_key_update','webhook_not_blocked_by_concurrent_sale_key_share',
                    'webhook_effect_visible_inside_its_txn','live_webhook_projects_tenant_while_sale_holds_key_share',
                    'webhook_still_excludes_concurrent_tenant_writer','no_billing_or_customer_rows_persisted',
                    'synthetic_tenant_and_user_removed',
                    'concurrent_webhooks_same_tenant_serialized','tenant_writer_waits_for_inflight_webhook',
                    'same_event_concurrent_second_waits','same_event_sequential_applied_then_duplicate_one_row'}
          passed={r['name'] for r in rows if r.get('passed')}
          print('RELEASE_BILLING_LOCK '+json.dumps({'missing':sorted(required-passed),
                'failed':sorted(r['name'] for r in rows if not r.get('passed'))}))
          assert len(required)==11 and required<=passed and all(r.get('passed') for r in rows)
          PY
      - name: Migration history and database advisors
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "$RUNNER_TEMP/monjez-c5sale-stack" migration list --local > "$RUNNER_TEMP/migrations.txt"
          echo "RELEASE_APPLIED_MIGRATIONS $(grep -cE '^ *[0-9]{14} ' "$RUNNER_TEMP/migrations.txt")"
          supabase --workdir "$RUNNER_TEMP/monjez-c5sale-stack" db advisors --local --fail-on error > "$RUNNER_TEMP/advisors-private.txt" 2>&1
      - name: Signed-in owner writes only the tenant columns the app writes
        # C-TENANT-01: as the role PostgREST uses, every case rolled back; synthetic
        # rows only, removed by the probe. Runs once per mode on the collection job.
        if: matrix.suite == 'collection'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monjez-c5sale/repo
          sudo -u c5finance env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 CI_ISOLATED_SUPABASE=1 \
            PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres \
            python -I tests/tenant-grants/probe.py /tmp/monjez-c5sale/evidence
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/monjez-c5sale/evidence/tenant-grants.json').read_text())['controls']
          required={'app_onboarding_insert_allowed_and_owner_role_linked','insert_with_timezone_and_business_type_allowed',
                    'stored_tenant_unchanged_and_no_extra_rows','synthetic_tenant_and_user_removed'}
          required|={f'app_update_{c}_allowed_and_touch_trigger_sets_updated_at' for c in ('name','business_type','timezone')}
          required|={f'owner_{n}_denied_42501' for n in ('insert_id','insert_created_at','insert_updated_at','update_id',
                     'update_owner_user_id','update_created_at','update_updated_at','update_trial_ends_at',
                     'update_subscription_status','insert_subscription_status','upsert_on_id')}
          passed={r['name'] for r in rows if r.get('passed')}
          print('RELEASE_TENANT_GRANTS '+json.dumps({'controls':len(rows),'missing':sorted(required-passed),
                'failed':sorted(r['name'] for r in rows if not r.get('passed'))}))
          assert len(required)==18 and required<=passed and all(r.get('passed') for r in rows)
          PY
      - name: Logical backup and restore of the candidate database (C6/C7 plan 2.2)
        # Synthetic data only: the database the suite and probes above have just used. Backup = the Supabase
        # CLI split dump (roles, schema, data) plus the migration ledger; restore = a FRESH stack on the same
        # loopback ports, so the c5finance firewall is unchanged. ALL repository SQL and Python, the restore
        # itself included, run as c5finance; only the CLI, docker and pg_isready run as the runner, as in the
        # stack steps above.
        # File isolation (review fix, Strix HIGH on da33d39): no root or runner file operation targets a path
        # c5finance can modify. Everything privileged lives in a fresh mktemp directory R under /tmp, owned by the
        # runner, mode 0711, laid out before c5finance gets anything:
        #   R/in  root:c5finance 0750, files 0640: the dumps, the target status and the restore SQL, copied from
        #         the runner's own checkout ($GITHUB_WORKSPACE), never from c5finance's repository copy
        #   R/c5  c5finance 0700: everything c5finance writes (guard and suite output, its private state); root
        #         never writes, chowns or reads in it. The runner reads named result files back only THROUGH
        #         c5finance (sudo -u c5finance cat), into runner-owned files
        # Nothing is written into /tmp/monjez-c5sale or its evidence directory. The step's attestation (four named
        # verification files, checked to hold none of the restore stack keys or restored-suite actor secrets, plus
        # their sha256 digests and the tested source) is staged in the runner-only $RUNNER_TEMP/restore-attestation,
        # NOT in the publication tree that the cleanup step later fills from c5finance's evidence (review fix, Strix
        # MEDIUM on 6c13bc2); the cleanup step places it and re-verifies it after that merge. R and the private copies
        # are deleted at the end.
        # Controls, all required:
        #   the privileged layout is runner/root-owned and not writable by c5finance (checked as c5finance)
        #   restored data identical per table (public, monjez_private, auth, supabase_migrations)
        #   restored catalog identical (normalized ACLs, view queries, and application triggers on platform tables
        #   such as auth.users, which the CLI schema dump omits and the step restores from the source); the
        #   catalog guard passes on the restored copy
        #   the candidate's collection behavioural suite runs on the restored copy and passes its core controls
        #   negative: a restore WITHOUT the ACL prelude must change the catalog and fail the guard
        #   negative: one tampered ledger row must change the data hash, inside a transaction that rolls back; the
        #   per-table hashes must equal the restored ones again before the behavioural suite starts
        #   the published restore evidence is exactly the named files and holds no private value
        if: matrix.suite == 'collection'
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/monjez-c5sale-stack"; tgt="$RUNNER_TEMP/monjez-restore-stack"; work="$RUNNER_TEMP/restore-work"
          base=/tmp/monjez-c5sale; repo="$base/repo"; ws="$GITHUB_WORKSPACE/tests/release/restore"
          att="$RUNNER_TEMP/restore-attestation"   # runner-only; placed into the publication by the cleanup step
          url=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          umask 077; mkdir -p "$work"; mkdir "$att"   # fails if it already exists
          # the privileged layout, complete before any c5finance command in this step
          R=$(mktemp -d /tmp/monjez-restore.XXXXXXXXXX); chmod 711 "$R"
          in="$R/in"; c5="$R/c5"
          sudo install -d -m 750 -o root -g c5finance "$in"
          sudo install -d -m 700 -o c5finance -g c5finance "$c5"
          trap 'supabase --workdir "$tgt" stop --no-backup > /dev/null 2>&1 || true
                sudo -u c5finance rm -rf "${c5:?}" 2> /dev/null || true; sudo rm -rf "${R:?}"
                rm -f "${work:?}/status-tgt-private.json" "${work:?}/restore-private-state.json" "${work:?}/tamper.sql"' EXIT
          put() { sudo install -m 640 -o root -g c5finance "$1" "$in/$2"; }   # $1 is a runner-owned file
          for f in fingerprint data_hash prelude app_triggers_outside; do put "$ws/$f.sql" "$f.sql"; done
          as5() { sudo -u c5finance env -i PATH="$PATH" PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres "$@"; }
          asq() { as5 psql -X -v ON_ERROR_STOP=1 -At -q -f "$1"; }
          fetch() { as5 cat "$c5/$1" > "$work/$2" 2> /dev/null || rm -f "${work:?}/$2"; }   # c5finance reads its own file
          guard() { as5 mkdir -m 700 "$c5/$1"
                    (cd "$repo" && as5 env PYTHONDONTWRITEBYTECODE=1 CI_ISOLATED_SUPABASE=1 python -I tests/catalog-guard/guard.py "$c5/$1" > /dev/null 2>&1); }
          ready() { for i in $(seq 1 90); do pg_isready -q -h 127.0.0.1 -p 54322 && return 0; sleep 2; done; return 1; }
          restore() { # $1 = with|without prelude; every file is read and executed by c5finance, from R/in
            files=(-f "$in/roles.sql"); [[ "$1" == with ]] && files+=(-f "$in/prelude.sql")
            as5 psql -X --single-transaction -v ON_ERROR_STOP=1 -q \
              "${files[@]}" -f "$in/schema.sql" -f "$in/app_triggers.sql" -c 'SET session_replication_role = replica' -f "$in/data_app.sql" -f "$in/ledger.sql" \
              > "$work/restore-$1-private.log" 2>&1; }
          as5 id -un > "$work/identity.txt"   # the OS identity every repository SQL/Python call below runs as
          # layout control, observed as c5finance: neither R nor R/in may be writable by it
          { stat -c '%U %a' "$R"; stat -c '%U %G %a' "$in"; stat -c '%U %G %a' "$c5"
            if as5 test -w "$R"; then echo 'R_WRITABLE_BY_C5FINANCE'; fi
            if as5 test -w "$in"; then echo 'IN_WRITABLE_BY_C5FINANCE'; fi; } > "$work/layout.txt"
          asq "$in/fingerprint.sql" > "$work/src.fp"
          asq "$in/data_hash.sql" > "$work/src.data"
          asq "$in/app_triggers_outside.sql" > "$work/app_triggers.sql"
          supabase db dump --db-url "$url" -f "$work/roles.sql" --role-only > "$work/dump-private.log" 2>&1
          supabase db dump --db-url "$url" -f "$work/schema.sql" >> "$work/dump-private.log" 2>&1
          supabase db dump --db-url "$url" -f "$work/data.sql" --use-copy --data-only >> "$work/dump-private.log" 2>&1
          db="supabase_db_$(sed -n 's/^project_id = "\(.*\)"/\1/p' "$src/supabase/config.toml")"
          docker exec "$db" pg_dump -U postgres -d postgres -n supabase_migrations --no-owner --no-privileges > "$work/ledger.sql"
          # platform-owned rows the postgres role cannot restore; application data is never in these schemas
          awk '/^COPY "(storage|supabase_functions)"\./{skip=1; next} skip && /^\\\.$/{skip=0; next} !skip' "$work/data.sql" > "$work/data_app.sql"
          for f in roles schema app_triggers data_app ledger; do put "$work/$f.sql" "$f.sql"; done
          rm -f "$work/roles.sql" "$work/schema.sql" "$work/app_triggers.sql" "$work/data.sql" "$work/data_app.sql" "$work/ledger.sql"
          supabase --workdir "$src" stop --no-backup > "$work/stop-src-private.log" 2>&1
          mkdir -p "$tgt" && (cd "$tgt" && supabase init > "$work/init-tgt-private.log" 2>&1)
          supabase --workdir "$tgt" start -x realtime,storage,imgproxy,inbucket,mailpit,meta,studio,edge-runtime,functions,analytics,vector,supavisor,pooler \
            > "$work/start-tgt-private.log" 2>&1 || { echo 'RELEASE_RESTORE_TARGET_START_FAILED_PRIVATE_LOG_WITHHELD'; exit 1; }
          ready
          n1_restore=0; restore without || n1_restore=$?
          asq "$in/fingerprint.sql" > "$work/n1.fp"
          n1_guard=0; guard restore-n1-guard || n1_guard=$?
          fetch restore-n1-guard/catalog-guard.json restore-n1-guard.json
          supabase --workdir "$tgt" db reset --local > "$work/reset-tgt-private.log" 2>&1
          ready
          ok_restore=0; restore with || ok_restore=$?
          asq "$in/fingerprint.sql" > "$work/tgt.fp"
          asq "$in/data_hash.sql" > "$work/tgt.data"
          ok_guard=0; guard restore-guard || ok_guard=$?
          fetch restore-guard/catalog-guard.json restore-guard.json
          # negative probe: the ledger UPDATE goes right AFTER data_hash.sql's own "begin;" line, so the tamper and its
          # hash share one transaction that the file rolls back (review fix: it was inserted before BEGIN and committed).
          # Built by the runner from its own checkout into a runner-owned file, then copied into R/in (review fix: no
          # root tee or chown into a c5finance-writable directory).
          tam="update supabase_migrations.schema_migrations set name = coalesce(name, '') || '_tampered' where version = (select min(version) from supabase_migrations.schema_migrations);"
          awk -v u="$tam" '{print} !done && /^begin;/{print u; done=1} END{exit done ? 0 : 3}' "$ws/data_hash.sql" > "$work/tamper.sql"
          put "$work/tamper.sql" tamper.sql
          asq "$in/tamper.sql" > "$work/tamper.data"
          # the restored copy must be exactly as restored again BEFORE the behavioural suite starts
          asq "$in/data_hash.sql" > "$work/after_tamper.data"
          cmp -s "$work/after_tamper.data" "$work/tgt.data" || { echo 'RELEASE_RESTORE_TAMPER_NOT_ROLLED_BACK'; exit 1; }
          # the candidate's collection behavioural suite, on the restored copy (fresh contract: its own new actors)
          supabase --workdir "$tgt" status -o json > "$work/status-tgt-private.json"
          put "$work/status-tgt-private.json" status.json
          as5 mkdir -m 700 "$c5/restore-suite"
          suite_exit=0
          (cd "$repo" && sudo -u c5finance env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 PLAYWRIGHT_BROWSERS_PATH=/tmp/collection-playwright \
            MONJEZ_RELEASE_TARGET=1 EXPECTED_SOURCE="$EXPECTED_SOURCE" CONTRACT_MODE=fresh \
            MONGEZZ_DEPLOY_TARGET=ci MONGEZZ_E2E_WRITE_TEST=1 CI_ISOLATED_SUPABASE=1 \
            VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY=c5finance-preflight-placeholder \
            PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres \
            python tests/c5-collection/native.py --expected-source "$EXPECTED_SOURCE" \
              --status-file "$in/status.json" --evidence-dir "$c5/restore-suite" \
              --private-state "$c5/private-state.json" > "$work/restore-suite-private.log" 2>&1) || suite_exit=$?
          fetch restore-suite/financial-result.json suite-result.json
          fetch private-state.json restore-private-state.json
          # runner only, no sudo: every input below is a runner-owned file in $work, every output is in $att
          WORK="$work" ATT="$att" N1_RESTORE="$n1_restore" N1_GUARD="$n1_guard" OK_RESTORE="$ok_restore" OK_GUARD="$ok_guard" \
            SUITE_EXIT="$suite_exit" RUNNER_USER="$(id -un)" EXPECTED_SOURCE="$EXPECTED_SOURCE" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          w, att = Path(os.environ['WORK']), Path(os.environ['ATT'])
          rd = lambda n: (w / n).read_text().splitlines()
          src_fp, tgt_fp, n1_fp = rd('src.fp'), rd('tgt.fp'), rd('n1.fp')
          src_d, tgt_d, tam_d = rd('src.data'), rd('tgt.data'), rd('tamper.data')
          after_tam_d = rd('after_tamper.data')
          identity, layout = rd('identity.txt'), rd('layout.txt')
          def load(n):
              p = w / n
              try:
                  return json.loads(p.read_text()) if p.exists() else {}
              except ValueError:
                  return {}
          def guard_ok(d):
              rows = d.get('controls') or []
              return bool(rows) and all(r.get('passed') for r in rows) and any(r.get('name') == 'baseline_no_violations' and r.get('passed') for r in rows)
          rows_in = lambda lines, prefix: sum(int(l.split('|')[1]) for l in lines if l.startswith(prefix))
          # the same core collection controls the suite's own "Required controls" step demands in every mode
          core = {'real_hook_single_stored_collection', 'parallel_fresh_key_exactly_one_effect',
                  'keyed_only_acl_and_existing_ledger_rls', 'settlement_retry_no_second_cash',
                  'concurrent_same_sale_key_exactly_one_effect', 'concurrent_collection_cannot_exceed_total',
                  'lost_reply_first_commit_persisted_once', 'previously_authorized_staff_banned'}
          suite = load('suite-result.json')
          srows = suite.get('controls') or suite.get('checks') or []
          spassed = {r.get('name') for r in srows if r.get('passed')}
          ok_guard, n1_guard = load('restore-guard.json'), load('restore-n1-guard.json')
          controls = [
            ('repository_sql_runs_as_c5finance', identity == ['c5finance']),
            ('private_layout_not_writable_by_c5finance',
             layout == [os.environ['RUNNER_USER'] + ' 711', 'root c5finance 750', 'c5finance c5finance 700']),
            ('source_fingerprint_nonempty', len(src_fp) > 100),
            ('source_data_hash_nonempty', len(src_d) > 20 and rows_in(src_d, 'supabase_migrations.') > 0),
            ('restore_with_prelude_succeeded', os.environ['OK_RESTORE'] == '0'),
            ('restored_data_identical_per_table', src_d == tgt_d),
            ('restored_catalog_identical', src_fp == tgt_fp),
            ('restored_catalog_guard_passes', os.environ['OK_GUARD'] == '0' and guard_ok(ok_guard)),
            ('restored_collection_suite_financial_acceptance', os.environ['SUITE_EXIT'] == '0' and suite.get('financial_acceptance') is True),
            ('restored_collection_suite_core_controls', bool(srows) and core <= spassed and all(r.get('passed') for r in srows)),
            ('negative_without_prelude_catalog_differs', os.environ['N1_RESTORE'] == '0' and n1_fp != src_fp),
            ('negative_without_prelude_guard_fails', not (os.environ['N1_GUARD'] == '0' and guard_ok(n1_guard))),
            ('tamper_rolled_back_before_suite', after_tam_d == tgt_d == src_d),
            ('negative_tampered_ledger_row_detected', tam_d != tgt_d and [l for l in tam_d if l not in tgt_d][0].startswith('supabase_migrations.schema_migrations|')),
          ]
          summary = {'source': os.environ['EXPECTED_SOURCE'], 'source_rows': {'public': rows_in(src_d, 'public.'), 'auth': rows_in(src_d, 'auth.'),
                                     'ledger': rows_in(src_d, 'supabase_migrations.')},
                     'fingerprint_lines': len(src_fp), 'data_tables': len(src_d),
                     'without_prelude_catalog_lines_changed': len(set(n1_fp) ^ set(src_fp)),
                     'restored_suite_controls': len(srows), 'restored_suite_exit': int(os.environ['SUITE_EXIT'])}
          # attestation: exactly these named verification files, each re-serialized to names and booleans, none
          # holding a restore-stack key or a restored-suite actor secret, plus their digests for the cleanup step
          status, state = load('status-tgt-private.json'), load('restore-private-state.json')
          forbidden = [str(v) for k, v in status.items() if any(s in k.upper() for s in ('KEY', 'PASSWORD', 'SECRET')) and v]
          forbidden += [str(v) for a in (state.get('actors') or {}).values() if isinstance(a, dict)
                        for k, v in a.items() if k in ('token', 'refresh', 'password', 'email') and v]
          verdict = lambda rows: [{'name': str(r.get('name')), 'passed': bool(r.get('passed'))} for r in rows]
          texts = {'restore-guard.json': {'controls': verdict(ok_guard.get('controls') or [])},
                   'restore-n1-guard.json': {'controls': verdict(n1_guard.get('controls') or [])},
                   'restore-suite-controls.json': {'controls': verdict(srows)}}
          check = {'controls': [{'name': n, 'passed': bool(p)} for n, p in controls], **summary}
          texts['restore-check.json'] = check
          texts = {n: json.dumps(v, indent=2) + '\n' for n, v in texts.items()}
          clean = bool(status) and bool(forbidden) and not any(f in t for t in texts.values() for f in forbidden)
          if clean:
              for n, t in texts.items():
                  (att / n).write_text(t)
              (att / 'restore-attestation.sha256').write_text(''.join(
                  hashlib.sha256(t.encode()).hexdigest() + '  ' + n + '\n' for n, t in sorted(texts.items())))
          published = sorted(p.name for p in att.iterdir())
          controls.append(('published_restore_evidence_named_and_secret_free',
                           clean and published == sorted(list(texts) + ['restore-attestation.sha256'])))
          failed = [n for n, p in controls if not p]
          print('RELEASE_RESTORE_CHECK ' + json.dumps({'failed': failed, 'attested': published, 'forbidden_values_checked': len(forbidden), **summary}))
          assert len(controls) == 15 and not failed
          PY
      - name: Cleanup and safe final receipts
        id: publication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-evidence"
          # Evidence import boundary (review fix, Strix review 4 on bed1035, CWE-59). The candidate's tree
          # /tmp/monjez-c5sale belongs to c5finance, so root never opens, walks or reads it: c5finance exports its
          # evidence with no link following (only real directories and regular files), the runner imports the stream
          # into a fresh runner-owned directory with strict names and no collisions, and the stack keys come from the
          # runner's own status copy. A rejection empties the publication and fails this step (asserted below), in
          # every matrix job. The restore attestation (Strix MEDIUM on 6c13bc2) is then placed as before. The same
          # script runs in the local emulation (tests/release/restore/run_cleanup_attestation_local.sh).
          tests/release/collect_evidence.sh "$out" "$RUNNER_TEMP/restore-attestation"
          rm -f "$RUNNER_TEMP/status-private.json" "$RUNNER_TEMP/start-private.log" "$RUNNER_TEMP/upgrade-private.log" "$RUNNER_TEMP/advisors-private.txt"
          if [[ -d "$RUNNER_TEMP/monjez-c5sale-stack/supabase" ]]; then
            supabase --workdir "$RUNNER_TEMP/monjez-c5sale-stack" stop --no-backup > "$RUNNER_TEMP/stop-private.log" 2>&1 || true
          fi
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);out=root/'release-evidence'
          def rejects(text):
              return sum(int(x.split()[0]) for x in text.splitlines() if 'REJECT' in x)
          before=rejects((root/'firewall-before.txt').read_text()) if (root/'firewall-before.txt').exists() else 0
          after=rejects(subprocess.check_output(['sudo','iptables','-nvxL','C5F'],text=True)) if before else 0
          sys.path.insert(0,'tests/account-lifecycle')
          from scanner_evidence import verify_publication, PublicationBlocked
          # forbidden values, collected without root reading the candidate's tree (tests/release/collect_evidence.sh)
          forbidden=json.loads((root/'publication-forbidden.json').read_text())
          imported=json.loads((root/'evidence-import.json').read_text())
          as_c5=['sudo','-u','c5finance','find','/tmp/monjez-c5sale','-maxdepth','1']   # c5finance acts in its own tree
          try:
              verify_publication(out,root/'release-private-quarantine',forbidden)
          finally:
              if imported['confined_identity_present']:
                  subprocess.run(as_c5+['-type','f','-name','*.json*','-delete'],check=False)
          cleanup={'source':os.environ['EXPECTED_SOURCE'],'suite':os.environ['SUITE'],'mode':os.environ['CONTRACT_MODE'],
                   'unexpected_ipv4_rejects':after-before,
                   'private_files_removed':not imported['confined_identity_present'] or not subprocess.run(as_c5+['-name','*.json*','-print'],capture_output=True,text=True).stdout.strip(),
                   'stack_removed':'monjez-c5sale-stack' not in subprocess.check_output(['docker','ps','--format','{{.Names}}'],text=True)}
          # restore attestation, re-verified AFTER the merge and the publication check: exact names, digests and source
          sys.path.insert(0,'tests/release/restore')
          from attestation import verify as verify_attestation
          attestation,collisions=verify_attestation(out,root/'restore-attestation',os.environ['EXPECTED_SOURCE'])
          cleanup['restore_attestation']=attestation; cleanup['restore_name_collisions']=collisions
          cleanup['evidence_import']={k:imported[k] for k in ('ok','export_exit','import_exit','private_state_exit','rejections')}
          (out/'cleanup.json').write_text(json.dumps(cleanup,indent=2)+'\n')
          print('RELEASE_CLEANUP '+json.dumps(cleanup))
          assert after==before and cleanup['private_files_removed'] and cleanup['stack_removed']
          assert not collisions and attestation in ('verified','absent'), 'RELEASE_RESTORE_ATTESTATION_'+attestation
          assert imported['ok'], 'RELEASE_EVIDENCE_IMPORT_REJECTED'
          PY
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.publication.outputs.safe == 'true'
        with:
          name: release-${{ matrix.suite }}-${{ matrix.mode }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/
          retention-days: 7
