name: SEC-CI Gate 4 Probe

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Run target-green CI policy probe
        shell: bash
        run: |
          set -euo pipefail
          bun tests/gate4/sec-ci/probe.ts > /tmp/sec-ci-g4.log 2>&1
          cat /tmp/sec-ci-g4.log

          grep -Fq \
            "SEC_CI_G4_TARGET_GREEN: setup-cli@v2 pinned to 2.101.0; reporting is least-privilege" \
            /tmp/sec-ci-g4.log || {
              echo "SEC_CI_G4_HARNESS_FAIL: exact target-green sentinel missing"
              exit 1
            }

          for unexpected in \
            SEC_CI_G4_E1_EXPECTED_RED \
            SEC_CI_G4_E2_EXPECTED_RED \
            SEC_CI_G4_E3_EXPECTED_RED \
            SEC_CI_G4_E4_EXPECTED_RED
          do
            if grep -Fq "$unexpected" /tmp/sec-ci-g4.log; then
              echo "SEC_CI_G4_HARNESS_FAIL: stale expected-red sentinel present: $unexpected"
              exit 1
            fi
          done

          echo "SEC_CI_G4_TARGET_GREEN_CONFIRMED"

  candidate-financial:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup candidate Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Verify candidate version
        shell: bash
        run: |
          set -euo pipefail
          actual="$(supabase --version)"
          test "$actual" = "2.101.0"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            echo "SEC_CI_INFRA_FAIL: candidate isolated Supabase failed to start; raw startup output withheld"
            exit 1
          fi

      - name: Capture and verify isolated environment
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a

          case "$API_URL" in
            http://127.0.0.1:54321|http://localhost:54321) ;;
            *) echo "SEC_CI_ISOLATION_FAIL: candidate API_URL is not loopback"; exit 1 ;;
          esac

          case "$DB_URL" in
            postgresql://*@127.0.0.1:54322/*|postgresql://*@localhost:54322/*|postgres://*@127.0.0.1:54322/*|postgres://*@localhost:54322/*) ;;
            *) echo "SEC_CI_ISOLATION_FAIL: candidate DB_URL is not loopback"; exit 1 ;;
          esac

          echo "::add-mask::$ANON_KEY"
          if [[ -n "${SERVICE_ROLE_KEY:-}" ]]; then
            echo "::add-mask::$SERVICE_ROLE_KEY"
          fi
          echo "::add-mask::$DB_URL"
          echo "CI_ISOLATED_SUPABASE=1" >> "$GITHUB_ENV"

      - name: Seed test owner and tenant
        shell: bash
        run: |
          set -euo pipefail
          test "${CI_ISOLATED_SUPABASE:-}" = "1"
          set -a
          source /tmp/supabase.env
          set +a

          curl --fail-with-body --silent --show-error \
            -X POST "$API_URL/auth/v1/signup" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"pilot.qa@mongezz.test","password":"PilotQA-Only-2026!","data":{"display_name":"Pilot QA"}}' \
            > /tmp/signup.json

          user_id="$(jq -r '.user.id // .id // empty' /tmp/signup.json)"
          if [[ -z "$user_id" ]]; then
            user_id="$(psql "$DB_URL" -Atc "select id from auth.users where email='pilot.qa@mongezz.test' limit 1")"
          fi
          test -n "$user_id"

          tenant_id="11111111-1111-4111-8111-111111111111"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v uid="$user_id" -v tid="$tenant_id" <<'SQL'
          INSERT INTO public.tenants (id, name, owner_user_id)
          VALUES (:'tid'::uuid, 'Pilot QA Tenant', :'uid'::uuid);

          INSERT INTO public.profiles (id, tenant_id, display_name)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'Pilot QA')
          ON CONFLICT (id) DO UPDATE
          SET tenant_id = EXCLUDED.tenant_id,
              display_name = EXCLUDED.display_name;

          INSERT INTO public.user_roles (user_id, tenant_id, role)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'owner')
          ON CONFLICT DO NOTHING;
          SQL

      - name: Run T1-T15 with candidate CLI
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash tests/financial-rules/run.sh

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup > /dev/null 2>&1 || true

  candidate-auth:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Setup candidate Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Verify candidate version
        shell: bash
        run: |
          set -euo pipefail
          actual="$(supabase --version)"
          test "$actual" = "2.101.0"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start isolated Supabase and export environment
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            echo "SEC_CI_INFRA_FAIL: candidate isolated Supabase failed to start; raw startup output withheld"
            exit 1
          fi

          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a

          case "$API_URL" in
            http://127.0.0.1:54321|http://localhost:54321) ;;
            *) echo "SEC_CI_ISOLATION_FAIL: candidate API_URL is not loopback"; exit 1 ;;
          esac

          case "$DB_URL" in
            postgresql://*@127.0.0.1:54322/*|postgresql://*@localhost:54322/*|postgres://*@127.0.0.1:54322/*|postgres://*@localhost:54322/*) ;;
            *) echo "SEC_CI_ISOLATION_FAIL: candidate DB_URL is not loopback"; exit 1 ;;
          esac

          echo "::add-mask::$ANON_KEY"
          if [[ -n "${SERVICE_ROLE_KEY:-}" ]]; then
            echo "::add-mask::$SERVICE_ROLE_KEY"
          fi
          echo "::add-mask::$DB_URL"

          {
            echo "MONGEZZ_DEPLOY_TARGET=ci"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_PROJECT_ID=local-ci"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_PROJECT_ID=local-ci"
            echo "DB_URL=$DB_URL"
            echo "CI_ISOLATED_SUPABASE=1"
            echo "APP_BASE_URL=http://127.0.0.1:8080"
          } >> "$GITHUB_ENV"

      - name: Create confirmed isolated QA account
        shell: bash
        run: |
          set -euo pipefail
          test "${CI_ISOLATED_SUPABASE:-}" = "1"
          test "${MONGEZZ_DEPLOY_TARGET:-}" = "ci"
          email="pilot.qa.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}@example.test"
          password="Pilot-QA-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}!"
          echo "::add-mask::$password"
          signup="$(curl --fail-with-body --silent --show-error \
            -X POST "$VITE_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\",\"data\":{\"display_name\":\"Pilot QA\"}}")"
          user_id="$(jq -r '.user.id // .id // empty' <<< "$signup")"
          test -n "$user_id"
          tenant_id="11111111-1111-4111-8111-111111111111"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v uid="$user_id" -v tid="$tenant_id" <<'SQL'
          UPDATE auth.users
             SET email_confirmed_at = COALESCE(email_confirmed_at, now()),
                 updated_at = now()
           WHERE id = :'uid'::uuid;

          INSERT INTO public.tenants (id, name, owner_user_id)
          VALUES (:'tid'::uuid, 'Pilot QA Tenant', :'uid'::uuid)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.profiles (id, tenant_id, display_name)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'Pilot QA')
          ON CONFLICT (id) DO UPDATE
          SET tenant_id = EXCLUDED.tenant_id,
              display_name = EXCLUDED.display_name;

          INSERT INTO public.user_roles (user_id, tenant_id, role)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'owner')
          ON CONFLICT DO NOTHING;
          SQL
          {
            echo "PILOT_QA_EMAIL=$email"
            echo "PILOT_QA_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Build production application against isolated Supabase
        run: bun run build

      - name: Start Cloudflare production emulator
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/wrangler.json

          set -a
          source /tmp/supabase.env
          set +a
          cat > /tmp/mongezz-worker.env <<EOF
          MONGEZZ_DEPLOY_TARGET=ci
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY
          VITE_SUPABASE_PROJECT_ID=$VITE_SUPABASE_PROJECT_ID
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_PROJECT_ID=$SUPABASE_PROJECT_ID
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF
          chmod 600 /tmp/mongezz-worker.env

          nohup bunx wrangler dev --config .output/server/wrangler.json --env-file /tmp/mongezz-worker.env --compatibility-date 2026-08-08 --ip 127.0.0.1 --port 8080 > /tmp/mongezz-app.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "SEC_CI_APP_FAIL: candidate local emulator did not become ready; raw output withheld"
          exit 1

      - name: Install Playwright
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Run read-only authenticated smoke with candidate CLI
        run: python3 tests/e2e/isolated-auth-smoke.py

      - name: Stop isolated Supabase
        if: always()
        shell: bash
        run: |
          rm -f /tmp/mongezz-worker.env
          supabase stop --no-backup > /dev/null 2>&1 || true


  esbuild-prepare:
    if: >-
      github.event_name == 'pull_request_review' && github.event.action == 'submitted' &&
      github.event.review.state == 'commented' &&
      github.event.review.user.login == 'naderalhaje097070-sudo' &&
      github.event.review.body == 'MONJEZ G0-ESBUILD-COMPAT-PROOF-01 PREPARE 2' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.pull_request.number == 72 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/g0-g1-acceptance-runtime-2026-10-14' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect verified official archives without executing MCP
        run: |
          set -euo pipefail
          python - <<'PYCOPY'
          import zipfile
          with zipfile.ZipFile('docs/g0-esbuild/preparation-failed.zip') as z:z.extractall('evidence/g0-esbuild')
          PYCOPY
          python tests/g0-esbuild/collect.py
      - name: Official bounded lock generation in disposable directory
        run: |
          set -euo pipefail
          out="$PWD/evidence/g0-esbuild"
          gen_dir="$(mktemp -d)"
          cp package.json bun.lock bunfig.toml "$gen_dir/"
          python - "$gen_dir/package.json" <<'PYGEN'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);d=json.loads(p.read_text())
          for key in ['overrides','resolutions']:d[key]['esbuild']='0.28.1'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PYGEN
          cd "$gen_dir"
          npm pack @oven/bun-linux-x64-baseline@1.4.0 --ignore-scripts --json > "$out/bun-tool-pack.json"
          node - "$out/bun-tool-pack.json" <<'JS'
          const fs=require('node:fs');const [p]=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(p.integrity!=='sha512-bX4PG7rWFkBL9laVJP8ESdQxkngLUyUiDEgYKohY+WtGQ2n8GSlA/2S5o394eEnacjQ/WC8+gebali7KoNvEpw==')throw Error('Unapproved generator integrity');
          JS
          tar -xzf oven-bun-linux-x64-baseline-1.4.0.tgz
          tool="$gen_dir/package/bin/bun"
          test "$("$tool" --version)" = 1.4.0
          "$tool" --revision | tee "$out/generator-revision.txt"
          grep -q 34cbb9a40 "$out/generator-revision.txt"
          timeout 120 "$tool" update esbuild --lockfile-only --ignore-scripts 2>&1 | tee "$out/generator.log"
          cp bun.lock package.json bunfig.toml "$out/"
          sha256sum bun.lock package.json bunfig.toml > "$out/generated-sha256.txt"
          git hash-object bun.lock > "$out/lock-blob.txt"
          cd "$GITHUB_WORKSPACE"
          cp bun.lock "$out/base-bun.lock"
          diff -u bun.lock "$out/bun.lock" > "$out/lock.diff" || test "$?" = 1
          git diff --exit-code --
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-esbuild-preparation
          path: evidence/g0-esbuild
          if-no-files-found: error

  esbuild-windows-baseline:
    if: >-
      github.event_name == 'pull_request_review' && github.event.action == 'submitted' &&
      github.event.review.state == 'commented' &&
      github.event.review.user.login == 'naderalhaje097070-sudo' &&
      github.event.review.body == 'MONJEZ G0-ESBUILD-COMPAT-PROOF-01 PREPARE 2' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.pull_request.number == 72 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/g0-g1-acceptance-runtime-2026-10-14' &&
      github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      REQUIRE_NATIVE_WINDOWS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.14'
      - name: Clean frozen vulnerable baseline outside source checkout
        run: |
          set -euo pipefail
          mkdir -p evidence/g0-esbuild
          git rev-parse HEAD > evidence/g0-esbuild/harness-source.txt
          echo 1b7a1a016f793c49d6b60f513c3241bb687681f3 > evidence/g0-esbuild/baseline-source.txt
          baseline_dir="$(mktemp -d)"
          for f in package.json bun.lock bunfig.toml; do
            git show "1b7a1a016f793c49d6b60f513c3241bb687681f3:$f" > "$baseline_dir/$f"
          done
          cd "$baseline_dir"
          bun install --frozen-lockfile 2>&1 | tee "$GITHUB_WORKSPACE/evidence/g0-esbuild/frozen-baseline.log"
          echo "ESBUILD_ROOT=$(cygpath -w "$baseline_dir/node_modules/esbuild")" >> "$GITHUB_ENV"
      - name: Exact native Windows old regression failures
        run: python tests/g0-esbuild/evidence.py baseline
      - name: Tracked source intact
        if: always()
        run: git diff --exit-code --
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-esbuild-windows-baseline
          path: evidence/g0-esbuild
          if-no-files-found: error
