name: MCP Issuer Contract
on:
  pull_request:
    paths:
      - '.github/workflows/mcp-issuer-contract.yml'
      - 'changes/mcp-local-issuer/**'
      - 'tests/unit/mcp-issuer*'
      - 'config/supabase-build-config.ts'
      - 'src/lib/mcp/index.ts'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.14'
      - run: bun install --frozen-lockfile
      - name: Inspect exact SDK contract before implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('node_modules/@lovable.dev/mcp-js')
          package=json.loads((root/'package.json').read_text())
          assert package['version']=='0.20.1'
          print(json.dumps(package))
          print((root/'README.md').read_text())
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.suffix in ('.js','.ts') and (p.name == 'types-CPkhCRxc.d.ts' or (p.suffix == '.js' and any(s in p.read_text() for s in ['jwtVerify(', 'requireOAuthClientClaim', 'function defineMcp(', 'function createMcpProtocolHandler(']))):
                  print('SDK_FILE',str(p))
                  print(p.read_text())
          PY
      - name: Local issuer regression (must fail before repair)
        env:
          MONGEZZ_DEPLOY_TARGET: ci
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: issuer-contract-placeholder
          VITE_SUPABASE_PROJECT_ID: monjez-mcp-ci
        run: bun test tests/unit/mcp-issuer.test.ts
