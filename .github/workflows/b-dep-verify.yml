name: B dependency and request boundary verification

on:
  push:
    branches: [integration/g0-g1-reconcile-2026-10-18]
    paths:
      - .github/workflows/b-dep-verify.yml
      - package.json
      - bun.lock
      - src/lib/mcp/request-boundary.ts
      - src/server.ts
      - tests/b-dependency/**
      - tests/unit/mcp-request-boundary.test.ts
      - tests/g01-acceptance/integrated-b-source.json
      - tests/g01-acceptance/integrated_identity.py
      - tests/g01-acceptance/test_integrated_identity.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Supported full current audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b-dep-audit"
          bun audit --help > "$RUNNER_TEMP/b-dep-audit/help.txt"
          bun audit --json > "$RUNNER_TEMP/b-dep-audit/raw.json"
          node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(JSON.stringify(d)!=="{}")throw Error("Audit not empty")' "$RUNNER_TEMP/b-dep-audit/raw.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b-dep-audit
          path: ${{ runner.temp }}/b-dep-audit
          if-no-files-found: error
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: ${{ github.sha }}
      MONGEZZ_DEPLOY_TARGET: ci
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: boundary-native-placeholder
      VITE_SUPABASE_PROJECT_ID: boundary-native
      NITRO_PRESET: node-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.14'
      - run: bun install --frozen-lockfile
      - name: Actual entry placement and source inventory negative controls
        run: |
          python tests/g01-acceptance/capture.py identity
          cp "$RUNNER_TEMP/g01-evidence/identity.json" "$RUNNER_TEMP/b-dep-identity-before.json"
          bun test tests/b-dependency/entry.test.ts
          PYTHONDONTWRITEBYTECODE=1 python tests/g01-acceptance/test_integrated_identity.py
      - name: Build actual standalone server with dummy loopback identity
        run: bun run build
      - name: Actual native HTTP request boundary and existing unauthenticated rejection
        run: node tests/b-dependency/native-http.mjs "$RUNNER_TEMP/b-dep-native-http.json"
      - name: Build does not mutate source
        run: |
          git diff --exit-code
          python tests/g01-acceptance/capture.py identity
          cp "$RUNNER_TEMP/g01-evidence/identity.json" "$RUNNER_TEMP/b-dep-identity-after.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b-dep-native-entry
          path: |
            ${{ runner.temp }}/b-dep-native-http.json
            ${{ runner.temp }}/b-dep-identity-before.json
            ${{ runner.temp }}/b-dep-identity-after.json
          if-no-files-found: warn
