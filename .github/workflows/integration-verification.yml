name: Integrated G0 verification
"on":
  push:
    branches:
      - integration/g0-g1-reconcile-2026-10-18
    paths:
      - src/**
      - tests/**
      - scripts/**
      - config/**
      - package.json
      - bun.lock
      - .github/workflows/integration-verification.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - src/**
      - config/**
      - scripts/**
      - tests/**
      - supabase/migrations/**
      - package.json
      - bun.lock
      - vite.config.ts
      - tsconfig.json
      - .github/workflows/**
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check reviewed generated source formatting
        run: node scripts/format-generated.mjs --check
      - name: Exact integrated source identity and fail-closed mutations
        run: "python tests/g01-acceptance/capture.py identity

          python tests/g01-acceptance/test_integrated_identity.py

          python tests/c-source/test_identity.py"
      - name: C4 source admission mutation contracts
        run: python tests/c4-sale/test_identity.py
      - name: SEC 20261102 exact graph installed engine and negative controls
        run: |
          python tests/sec-dep-20261102/test_identity.py
          python tests/sec-dep-20261102/graph.py
          python tests/sec-dep-20261102/test_graph.py
          python tests/sec-dep-20261102/installed.py
          python tests/sec-dep-20261102/test_installed.py
          node --test tests/sec-dep-20261102/contracts.cjs
      - name: Typecheck
        run: bun run typecheck
      - name: Full repository lint including CommonJS and ESM
        shell: bash
        run: "set -euo pipefail

          bun run lint 2>&1 | tee /tmp/lint.log

          "
      - name: Read-only existing CI policy contract
        run: bun tests/gate4/sec-ci/probe.ts
      - name: Unit tests
        run: bun run test:unit
      - name: Type erasure and actual hook callback wire replay
        run: "node --test tests/b-dependency/webhook-bridge.test.cjs

          node --test tests/account-lifecycle/webhook_handler.test.cjs

          node --test tests/c-source/quantity-bridge.test.cjs

          node tests/g0-integrated-types/runtime.cjs

          node --test tests/c4-sale/contracts.test.cjs tests/c4-sale/history.test.cjs

          "
      - name: Build entry failure and forwarding contracts
        run: python tests/g0-integrated-types/test_build_entry.py
      - name: Focused foundation read and CI regressions
        run: 'node tests/app-financial-read/build.mjs "$RUNNER_TEMP/app-financial-read"

          node tests/app-financial-read/replay.mjs "$RUNNER_TEMP/app-financial-read"

          node tests/trial-status/replay.mjs "$RUNNER_TEMP/trial-status"

          node tests/day-close-clock/replay.mjs "$RUNNER_TEMP/day-close-clock"

          python tests/test_changed_lint.py "$RUNNER_TEMP/changed-lint"

          '
      - name: Offline server environment boundary
        run: bun tests/gate4/sec-env/server-boundary.ts
      - name: Setup Python for browser containment regression
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned browser test tooling
        run: "python -m pip install -r tests/gate4/sec-env/requirements.txt

          python -m playwright install chromium --only-shell --with-deps

          "
      - name: Verify browser redirect, WebSocket and origin containment
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/gate4/sec-env/browser-network.py
      - name: Actual financial read UI and export regression
        run: python tests/app-financial-read/browser.py "$RUNNER_TEMP/app-financial-read"
      - name: Build from mode-specific env file
        shell: bash
        run:
          "set -euo pipefail\ntrap 'rm -f .env.sec-env-contract' EXIT\ncat > .env.sec-env-contract <<'EOF'\nMONGEZZ_DEPLOY_TARGET=ci\n\
          VITE_SUPABASE_URL=http://127.0.0.1:54321\nVITE_SUPABASE_PUBLISHABLE_KEY=quality-env-file-placeholder\nVITE_SUPABASE_PROJECT_ID=quality-env-file\n\
          EOF\n\nenv \\\n  -u MONGEZZ_DEPLOY_TARGET \\\n  -u VITE_SUPABASE_URL \\\n  -u VITE_SUPABASE_PUBLISHABLE_KEY\
          \ \\\n  -u VITE_SUPABASE_PROJECT_ID \\\n  node scripts/build.mjs --mode sec-env-contract\n"
      - name: Build
        env:
          MONGEZZ_DEPLOY_TARGET: ci
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: quality-build-placeholder
          VITE_SUPABASE_PROJECT_ID: quality-build
        run: bun run build
      - name: Verify generation leaves tracked application files intact
        run: git diff --exit-code --
      - name: Recheck complete protected source after both builds
        run: python tests/g01-acceptance/capture.py identity
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: "/tmp/lint-files.txt

            /tmp/lint.log

            ${{ runner.temp }}/app-financial-read/browser.json

            ${{ runner.temp }}/app-financial-read/replay.json

            "
          if-no-files-found: warn
      - name: Upload source identity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-identity
          path: ${{ runner.temp }}/g01-evidence/identity.json
          retention-days: 7
          if-no-files-found: warn
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Complete supported audit with actual exit preserved
        shell: bash
        run: "set -euo pipefail

          bun audit --json 2>&1 | tee /tmp/integration-audit.log

          "
      - name: Upload complete audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-full-audit
          path: /tmp/integration-audit.log
          retention-days: 7
