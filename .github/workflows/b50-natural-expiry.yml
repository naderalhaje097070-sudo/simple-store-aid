name: B50 Real Token Expiry
'on':
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - src/**
    - config/**
    - scripts/**
    - tests/**
    - supabase/migrations/**
    - package.json
    - bun.lock
    - vite.config.ts
    - tsconfig.json
    - .github/workflows/**
  push:
    branches:
    - integration/g0-g1-reconcile-2026-10-18
    paths:
    - tests/b50-natural-expiry/**
    - .github/workflows/b50-natural-expiry.yml
    - tests/g01-acceptance/integrated-b-source.json
permissions:
  contents: read
jobs:
  natural-expiry-b50:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      MONGEZZ_DEPLOY_TARGET: ci
      MONGEZZ_E2E_WRITE_TEST: '1'
      CI_ISOLATED_SUPABASE: '1'
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: route-preflight-placeholder
      PGHOST: 127.0.0.1
      PGPORT: '54322'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout exact source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check shared oracle and route acceptance
      run: 'python tests/b5-lifecycle/inventory.py

        python -m unittest discover -s tests/account-lifecycle -p test_mcp_probe.py -v

        python -m unittest discover -s tests/account-lifecycle -p test_natural_expiry_probe.py -v

        python -m unittest discover -s tests/account-lifecycle -p test_oauth_consent_fixture.py -v

        python -m unittest discover -s tests/b50-natural-expiry -p test_adapter.py -v

        '
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.14
    - name: Setup native Node runtime
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install exact locked dependencies
      run: bun install --frozen-lockfile > "$RUNNER_TEMP/route-install-private.log" 2>&1
    - name: Check existing cryptographic issuer contract
      run: bun test tests/unit/mcp-issuer.test.ts
    - name: Inspect installed verifier contract
      run: python tests/account-lifecycle/natural_expiry_contract.py
    - name: Setup pinned Supabase CLI
      uses: supabase/setup-cli@v2
      with:
        version: 2.101.0
    - name: Inspect CLI and validate isolated intent
      run: 'set -euo pipefail

        test "$(supabase --version)" = ''2.101.0''

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        supabase --help > "$RUNNER_TEMP/route-cli-help.txt"

        grep -q -- ''--workdir'' "$RUNNER_TEMP/route-cli-help.txt"

        python tests/e2e/write_harness_guard.py --preflight-only

        '
    - name: Install local test prerequisites
      run: 'sudo apt-get update -qq

        sudo apt-get install -y postgresql-client iptables > "$RUNNER_TEMP/route-psql-private.log" 2>&1

        '
    - name: Prove real process containment before credentials
      shell: bash
      run: "set -euo pipefail\nsudo useradd --system --no-create-home --shell /usr/sbin/nologin mcp-route\nuid=\"\
        $(id -u mcp-route)\"\nsudo iptables -N MCP_ROUTE\nsudo iptables -A MCP_ROUTE -o lo -d 127.0.0.1/32 -j ACCEPT\n\
        sudo iptables -A MCP_ROUTE -j REJECT --reject-with icmp-port-unreachable\nsudo iptables -I OUTPUT 1 -m owner\
        \ --uid-owner \"$uid\" -j MCP_ROUTE\nsudo ip6tables -I OUTPUT 1 -m owner --uid-owner \"$uid\" -j REJECT\n\
        # Hosted runner workspace ancestors may be private to runner. Copy only\n# the containment preload, then\
        \ later the exact standalone build output.\nsudo install -d -m 755 -o mcp-route /tmp/monjez-tanstack-route\n\
        sudo install -m 644 tests/account-lifecycle/tanstack_route_guard.mjs /tmp/monjez-tanstack-route/guard.mjs\n\
        cmp tests/account-lifecycle/tanstack_route_guard.mjs /tmp/monjez-tanstack-route/guard.mjs\nif sudo -u mcp-route\
        \ test -r \"$GITHUB_WORKSPACE/tests/account-lifecycle/tanstack_route_guard.mjs\"; then\n  echo 'ROUTE_ORIGINAL_WORKSPACE_READABLE=true'\n\
        else\n  echo 'ROUTE_ORIGINAL_WORKSPACE_READABLE=false'\nfi\nsudo -u mcp-route env -i PATH=/usr/bin:/bin\
        \ CI_ISOLATED_SUPABASE=1 \\\n  MCP_ROUTE_PREFLIGHT=1 MCP_ROUTE_STATE=/tmp/monjez-tanstack-route/preflight.json\
        \ \\\n  \"$(command -v node)\" --import /tmp/monjez-tanstack-route/guard.mjs \\\n  --input-type=module -e\
        \ ''\nsudo iptables -nvxL MCP_ROUTE > \"$RUNNER_TEMP/route-firewall.txt\"\nsudo ip6tables -C OUTPUT -m owner\
        \ --uid-owner \"$uid\" -j REJECT\nROUTE_UID=\"$uid\" python - <<'PYFIREWALL'\nimport json, os\nfrom pathlib\
        \ import Path\nroot = Path(os.environ['RUNNER_TEMP'])\nlines = (root/'route-firewall.txt').read_text().splitlines()\n\
        rejected = [int(line.split()[0]) for line in lines if 'REJECT' in line]\nassert len(rejected) == 1 and rejected[0]\
        \ > 0, 'Native redirect not blocked by UID firewall'\nreceipt = {'uid': int(os.environ['ROUTE_UID']), 'ipv4_reject_packets':\
        \ rejected[0],\n           'ipv6_rule_installed': True, 'credential_free_preflight': True,\n           'policy':\
        \ 'dedicated UID: IPv4 exact loopback only; IPv6 rejected'}\n(root/'route-firewall.json').write_text(json.dumps(receipt))\n\
        print(json.dumps(receipt))\nPYFIREWALL\n"
    - name: Start fresh disposable Supabase with real OAuth
      shell: bash
      run: "set -euo pipefail\numask 077\nstack=\"$RUNNER_TEMP/monjez-tanstack-route\"\nmkdir -p \"$stack\"\nsupabase\
        \ --workdir \"$stack\" init > \"$RUNNER_TEMP/route-init-private.log\" 2>&1\nSTACK_CONFIG=\"$stack/supabase/config.toml\"\
        \ python - <<'PYCONFIG'\nimport os\nfrom pathlib import Path\np = Path(os.environ['STACK_CONFIG'])\ns =\
        \ p.read_text()\nold = '[auth.oauth_server]\\n# Enable OAuth server functionality\\nenabled = false'\nassert\
        \ old in s, 'Pinned local OAuth configuration changed'\np.write_text(s.replace(old, old.replace('enabled\
        \ = false', 'enabled = true'), 1))\nPYCONFIG\npython tests/account-lifecycle/natural_expiry_contract.py\
        \ \"$stack/supabase/config.toml\"\nmkdir -p \"$stack/supabase/migrations\"\ncp supabase/migrations/*.sql\
        \ \"$stack/supabase/migrations/\"\nif ! supabase --workdir \"$stack\" start > \"$RUNNER_TEMP/route-start-private.log\"\
        \ 2>&1; then\n  echo 'ROUTE_STACK_START_FAILED: private output withheld'\n  exit 1\nfi\nsupabase --workdir\
        \ \"$stack\" status -o json > \"$RUNNER_TEMP/route-status.json\"\nchmod 600 \"$RUNNER_TEMP/route-status.json\"\
        \n# CLI start can print disposable keys; keep no credential-bearing log.\npython - <<'PYSCRUB'\nimport json,\
        \ os, re\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])\nstatus=json.loads((root/'route-status.json').read_text())\n\
        p=root/'route-start-private.log'\ntext=p.read_text()\nfor key,value in status.items():\n  if ('KEY' in key\
        \ or 'PASSWORD' in key) and isinstance(value,str) and value:\n    text=text.replace(value,'[REDACTED_LOCAL_CREDENTIAL]')\n\
        text=re.sub(r'eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}', '[REDACTED_LOCAL_JWT]', text)\n\
        text=re.sub(r'sb_(?:secret|publishable)_[A-Za-z0-9_-]{8,}', '[REDACTED_LOCAL_KEY]', text)\np.write_text(text)\n\
        PYSCRUB\n"
    - name: Build unchanged actual application for local Node runtime
      run: python tests/account-lifecycle/tanstack_route_build.py
    - name: Current B50 genuine same token across real expiry and fresh peers
      run: "python tests/b50-natural-expiry/probe.py \\\n  --status-file \"$RUNNER_TEMP/route-status.json\" \\\n\
        \  --evidence-dir \"$RUNNER_TEMP/route-evidence\" \\\n  --expected-source \"$EXPECTED_SOURCE\"\n"
    - name: Cleanup local processes stack and credential files
      if: always()
      shell: bash
      run: "set -euo pipefail\nif id mcp-route >/dev/null 2>&1; then\n  sudo pkill -TERM -u mcp-route || true\n\
        fi\nrm -f \"$RUNNER_TEMP/route-status.json\"\nif [[ -d \"$RUNNER_TEMP/monjez-tanstack-route/supabase\" ]];\
        \ then\n  supabase --workdir \"$RUNNER_TEMP/monjez-tanstack-route\" stop --no-backup > \"$RUNNER_TEMP/route-stop-private.log\"\
        \ 2>&1\nfi\nmkdir -p \"$RUNNER_TEMP/route-evidence\"\npython - <<'PYCLEAN'\nimport json, os, subprocess\n\
        from pathlib import Path\nroot = Path(os.environ['RUNNER_TEMP'])\nreceipt = {'status_file_removed': not\
        \ (root/'route-status.json').exists(),\n           'application_processes_removed': (subprocess.run(['id','mcp-route'],capture_output=True).returncode\
        \ != 0 or subprocess.run(['pgrep','-u','mcp-route'],capture_output=True).returncode == 1),\n           'stack_containers_removed':\
        \ 'monjez-tanstack-route' not in subprocess.run(['docker','ps','--format','{{.Names}}'],capture_output=True,text=True,check=True).stdout}\n\
        (root/'route-evidence/cleanup.json').write_text(json.dumps(receipt))\nassert all(receipt.values()), 'Disposable\
        \ cleanup incomplete'\nPYCLEAN\n"
    - name: Print allowlisted receipts
      if: always()
      run: "python - <<'PYRECEIPTS'\nimport os\nfrom pathlib import Path\nroot = Path(os.environ['RUNNER_TEMP'])/'route-evidence'\n\
        for name in ['build.json','expiry-contract.json','expiry-result.json','expiry-harness-failure.json','progress.json','cleanup.json']:\n\
        \  p=root/name\n  if p.exists():\n    print('ROUTE_RECEIPT_BEGIN '+name)\n    print(p.read_text())\n   \
        \ print('ROUTE_RECEIPT_END '+name)\nPYRECEIPTS\n"
    - name: Upload sanitized route evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: b50-natural-expiry-attempt${{ github.run_attempt }}
        path: ${{ runner.temp }}/route-evidence/
        retention-days: 7
        if-no-files-found: warn
