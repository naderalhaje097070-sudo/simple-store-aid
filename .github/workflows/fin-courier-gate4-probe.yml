name: FIN-COURIER Gate 4 Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "tests/financial-rules/fin-courier-gate4-*"
      - "tests/financial-rules/run-fin-courier-gate4*.sh"
      - "tests/e2e/fin-courier-gate4-ui*.py"
      - "changes/fin-courier-001/GATE4_EVIDENCE.md"
      - ".github/workflows/fin-courier-gate4-probe.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Seed isolated owner, tenant, and platform-admin capability
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source /tmp/supabase.env
          set +a

          email="fin-courier.g4.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}@example.test"
          password="Gate4-Only-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}!"
          signup="$(curl --fail-with-body --silent --show-error \
            -X POST "$API_URL/auth/v1/signup" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\",\"data\":{\"display_name\":\"Gate 4\"}}")"
          user_id="$(jq -r '.user.id // .id // empty' <<< "$signup")"
          test -n "$user_id"
          tenant_id="11111111-1111-4111-8111-111111111111"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -v uid="$user_id" -v tid="$tenant_id" <<'SQL'
          UPDATE auth.users
             SET email_confirmed_at = COALESCE(email_confirmed_at, now()),
                 updated_at = now()
           WHERE id = :'uid'::uuid;

          INSERT INTO public.tenants (id, name, owner_user_id)
          VALUES (:'tid'::uuid, 'FIN-COURIER Gate 4', :'uid'::uuid)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.profiles (id, tenant_id, display_name)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'Gate 4')
          ON CONFLICT (id) DO UPDATE
          SET tenant_id = EXCLUDED.tenant_id,
              display_name = EXCLUDED.display_name;

          INSERT INTO public.user_roles (user_id, tenant_id, role)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'owner')
          ON CONFLICT DO NOTHING;

          INSERT INTO public.platform_admins (user_id, note)
          VALUES (:'uid'::uuid, 'FIN-COURIER Gate 4 isolated reporting probe')
          ON CONFLICT (user_id) DO NOTHING;
          SQL

          {
            echo "GATE4_BACKEND_UID=$user_id"
            echo "GATE4_BACKEND_TID=$tenant_id"
          } >> "$GITHUB_ENV"

      - name: Execute consolidated backend safety net
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        shell: bash
        run: |
          set -o pipefail
          GATE4_UID="$GATE4_BACKEND_UID" \
          GATE4_TID="$GATE4_BACKEND_TID" \
          GATE4_EVIDENCE_DIR="/tmp/fin-courier-gate4-backend" \
            bash tests/financial-rules/run-fin-courier-gate4-all.sh \
            2>&1 | tee /tmp/gate4-backend-summary.log
          grep -q "GATE4_BACKEND_EVIDENCE_GREEN" /tmp/gate4-backend-summary.log

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-courier-gate4-backend
          path: |
            /tmp/fin-courier-gate4-backend
            /tmp/gate4-backend-summary.log
            /tmp/fin-courier-gate4-pr-a.log
            /tmp/g4-e1-a.log
            /tmp/g4-e1-b.log
            /tmp/g4-m14-partial.log
            /tmp/g4-m14-full.log
            /tmp/g4-m15-update.log
            /tmp/g4-m15-settle.log
          if-no-files-found: warn

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup || true

  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start isolated Supabase and export environment
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "DB_URL=$DB_URL"
            echo "CI_ISOLATED_SUPABASE=1"
            echo "APP_BASE_URL=http://127.0.0.1:8080"
          } >> "$GITHUB_ENV"

      - name: Seed isolated UI fixture
        shell: bash
        run: |
          set -euo pipefail
          email="fin-courier.ui.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}@example.test"
          password="Gate4-UI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}!"
          signup="$(curl --fail-with-body --silent --show-error \
            -X POST "$VITE_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\",\"data\":{\"display_name\":\"Gate 4 UI\"}}")"
          user_id="$(jq -r '.user.id // .id // empty' <<< "$signup")"
          test -n "$user_id"
          tenant_id="11111111-1111-4111-8111-111111111111"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -v uid="$user_id" -v tid="$tenant_id" <<'SQL'
          UPDATE auth.users
             SET email_confirmed_at = COALESCE(email_confirmed_at, now()),
                 updated_at = now()
           WHERE id = :'uid'::uuid;

          INSERT INTO public.tenants (id, name, owner_user_id)
          VALUES (:'tid'::uuid, 'FIN-COURIER Gate 4 UI', :'uid'::uuid)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.profiles (id, tenant_id, display_name)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'Gate 4 UI')
          ON CONFLICT (id) DO UPDATE
          SET tenant_id = EXCLUDED.tenant_id,
              display_name = EXCLUDED.display_name;

          INSERT INTO public.user_roles (user_id, tenant_id, role)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'owner')
          ON CONFLICT DO NOTHING;

          INSERT INTO public.products (id, tenant_id, name, price, cost, stock, is_active, is_discount)
          VALUES ('dddd4444-1000-0000-0000-000000000001', :'tid'::uuid, 'GATE4-PRODUCT', 100, 60, 10, true, false)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.couriers (id, tenant_id, name, is_active)
          VALUES ('ffff6666-1000-0000-0000-000000000001', :'tid'::uuid, 'GATE4-COURIER', true)
          ON CONFLICT (id) DO NOTHING;
          SQL

          {
            echo "PILOT_QA_EMAIL=$email"
            echo "PILOT_QA_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Build production application against isolated Supabase
        run: bun run build

      - name: Start Cloudflare production emulator
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/wrangler.json
          nohup bunx wrangler dev --config .output/server/wrangler.json --ip 127.0.0.1 --port 8080 > /tmp/gate4-app.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gate4-app.log
          exit 1

      - name: Install Playwright
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Prove primary-flow UI target is red
        shell: bash
        run: |
          set +e
          python3 tests/e2e/fin-courier-gate4-ui.py > /tmp/gate4-ui.log 2>&1
          rc=$?
          set -e
          cat /tmp/gate4-ui.log
          if [[ $rc -eq 0 ]]; then
            echo "Gate 4 baseline mismatch: primary-flow UI target unexpectedly passed before PR-C" >&2
            exit 1
          fi
          grep -q "GATE4_UI_EXPECTED_RED" /tmp/gate4-ui.log || {
            echo "Primary-flow UI probe failed for an unexpected harness/runtime reason" >&2
            exit 1
          }
          echo "EXPECTED-RED OK: primary-flow UI"

      - name: Prove wording/status UI target is red independently
        shell: bash
        run: |
          set +e
          python3 tests/e2e/fin-courier-gate4-ui-status.py > /tmp/gate4-ui-status.log 2>&1
          rc=$?
          set -e
          cat /tmp/gate4-ui-status.log
          if [[ $rc -eq 0 ]]; then
            echo "Gate 4 baseline mismatch: wording/status UI target unexpectedly passed before PR-C" >&2
            exit 1
          fi
          grep -q "GATE4_UI_STATUS_EXPECTED_RED" /tmp/gate4-ui-status.log || {
            echo "Wording/status UI probe failed for an unexpected harness/runtime reason" >&2
            exit 1
          }
          echo "EXPECTED-RED OK: wording/status UI"

      - name: Prove success-screen UI target is red independently
        shell: bash
        run: |
          set +e
          python3 tests/e2e/fin-courier-gate4-ui-success.py > /tmp/gate4-ui-success.log 2>&1
          rc=$?
          set -e
          cat /tmp/gate4-ui-success.log
          if [[ $rc -eq 0 ]]; then
            echo "Gate 4 baseline mismatch: success-screen target unexpectedly passed before PR-A/PR-C" >&2
            exit 1
          fi
          grep -q "GATE4_UI_SUCCESS_EXPECTED_RED" /tmp/gate4-ui-success.log || {
            echo "Success-screen UI probe failed for an unexpected harness/runtime reason" >&2
            exit 1
          }
          echo "EXPECTED-RED OK: success-screen UI"

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-courier-gate4-ui
          path: |
            /tmp/fin-courier-gate4-ui
            /tmp/fin-courier-gate4-ui-status
            /tmp/fin-courier-gate4-ui-success
            /tmp/gate4-ui.log
            /tmp/gate4-ui-status.log
            /tmp/gate4-ui-success.log
            /tmp/gate4-app.log
          if-no-files-found: warn

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup || true
