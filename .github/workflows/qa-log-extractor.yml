name: QA Log Extractor

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  extract-previous-smoke-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download previous authenticated smoke job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${{ github.repository }}/actions/jobs/86647240772/logs > /tmp/previous-smoke.log

      - name: Print focused failure context
        run: |
          grep -n -E -A45 -B12 "Traceback|TimeoutError|auth error|Invalid login|email_not_confirmed|بيانات الدخول|حدث خطأ" /tmp/previous-smoke.log || true
