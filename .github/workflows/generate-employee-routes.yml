name: Generate Employee Routes

on:
  push:
    branches:
      - feature/employee-accounts-custody-v1
    paths:
      - ".github/workflows/generate-employee-routes.yml"
      - "src/routes/_authenticated/employee.tsx"
      - "src/routes/_authenticated/employees.tsx"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/employee-accounts-custody-v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"
      - run: bun install --frozen-lockfile
      - name: Generate TanStack route tree
        run: bun run build
      - name: Commit generated route tree
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: generate employee routes"
          git push origin HEAD:feature/employee-accounts-custody-v1
