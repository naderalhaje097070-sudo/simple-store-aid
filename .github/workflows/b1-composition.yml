name: B1 composition compatibility
'on':
  push:
    branches:
    - integration/g0-g1-reconcile-2026-10-18
    paths:
    - .github/workflows/b1-composition.yml
    - config/**
    - src/**
    - tests/**
    - vite.config.ts
    - package.json
    - bun.lock
  # Unfiltered PRs ensure required checks never stay Pending for docs-only changes.
  pull_request:
    branches:
    - main
    - integration/g0-g1-reconcile-2026-10-18
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGEZZ_DEPLOY_TARGET: ci
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: b1-offline-placeholder
      VITE_SUPABASE_PROJECT_ID: b1-offline
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.14
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Frozen dependencies
      run: bun install --frozen-lockfile
    - name: Verify actual PR-head routing and historical benchmark boundaries
      run: node --test tests/b7-ci-routing/contract.test.cjs
    - name: Locked serialization exports
      run: node --input-type=module -e 'for (const p of ["@tanstack/router-core", "@tanstack/router-core/ssr/client"])
        { const m = await import(p); console.log(p, Object.keys(m).filter(x => /eroval/.test(x))); }'
    - name: Generated formatting
      run: node scripts/format-generated.mjs --check
    - name: Typecheck
      run: bun run typecheck
    - name: Full lint
      run: bun run lint
    - name: Unit tests
      run: bun run test:unit
    - name: Original OC APP wire regression
      run: node tests/account-lifecycle/oc_app_wire.test.mjs
    - name: Build
      if: '!cancelled() && success()'
      run: bun run build
    - name: Generation retains tracked files
      if: '!cancelled() && success()'
      run: git diff --exit-code
