name: SEC 20261102 matching engines and source contracts
# Retired from automatic push runs (2026-11-16), like the stage workflows retired on
# 2026-11-10: its step `node --test tests/c4-sale/history.test.cjs` pins
# src/routes/_authenticated/app.tsx to the historical C4 base blob and fails on every
# current integration head independently of the change pushed (verified identical on
# 2e4c8cc before #93 and on fc6b39b after it). Coverage map of what this workflow ran:
#   capture.py identity ................ integrated-quality (every PR) + this workflow (manual)
#   20261102 graph (historical) + 16 ... integrated-quality SEC step (every PR)
#   test_identity.py ................... integrated-quality SEC step (every PR)
#   20261116 graph + 24 tests .......... integrated-quality SEC step (every PR)
#   frozen install / installed.py ...... integrated-quality (every PR)
#   dependency-security.test.ts ........ integrated-quality unit tests + sec-dep-20261029.yml
#   sec-dep-20261102/contracts.cjs ..... integrated-quality SEC step (every PR)
#   c4-sale/contracts.test.cjs ......... integrated-quality + release-finance (every PR)
#   c4-sale/history.test.cjs ........... historical only: last green run 41492623491 at
#                                        552ce47 (2026-11-02); reproducible by checking out
#                                        that commit; not a current-state control
#   g0-node-server/contracts.test.cjs .. integrated-quality (added with this change) +
#                                        sec-dep-20261029.yml (push)
#   sec-dep-20261029/regressions.cjs ... integrated-quality (added with this change) +
#                                        sec-dep-20261029.yml (push)
#   git diff --exit-code ............... integrated-quality "Verify generation leaves
#                                        tracked application files intact"
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Exact source and whole graph before install
        run: |
          python tests/g01-acceptance/capture.py identity
          # 20261102 graph contract: unchanged verifier and all 16 controls, on the exact
          # 50530716 -> 2e4c8cc delta it reviewed (later deltas are admitted below).
          hist="$RUNNER_TEMP/sec-20261102-history"; mkdir -p "$hist"
          git show 50530716ab3163199de4187d3776356a49813dda:package.json > "$hist/baseline-package.json"
          git show 50530716ab3163199de4187d3776356a49813dda:bun.lock > "$hist/baseline-bun.lock"
          git show 2e4c8cce6b0c01bc4a99b81412cb43f1c641b24d:package.json > "$hist/package.json"
          git show 2e4c8cce6b0c01bc4a99b81412cb43f1c641b24d:bun.lock > "$hist/bun.lock"
          python tests/sec-dep-20261102/test_graph.py "$hist"
          python tests/sec-dep-20261102/test_identity.py
          # SEC-DEP-HONO-01: exact two-package delta 2e4c8cc -> head, with its controls.
          python tests/sec-dep-20261116/graph.py
          python tests/sec-dep-20261116/test_graph.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"
      - name: Normal full frozen consumer
        run: bun install --frozen-lockfile
      - name: Exact installed patch and financial source invariance
        run: |
          mkdir -p "$RUNNER_TEMP/sec-20261102-evidence"
          python tests/sec-dep-20261102/installed.py > "$RUNNER_TEMP/sec-20261102-evidence/installed.json"
          python tests/sec-dep-20261102/test_installed.py
          python tests/sec-dep-20261116/graph.py --installed
          bun test tests/unit/dependency-security.test.ts
          python tests/g01-acceptance/capture.py identity
      - name: Actual full installed consumer and bounded security contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/sec-dep-20261102/contracts.cjs 2>&1 | tee "$RUNNER_TEMP/sec-20261102-evidence/contracts.log"
          node --test tests/c4-sale/contracts.test.cjs tests/c4-sale/history.test.cjs
          node --test tests/g0-node-server/contracts.test.cjs
          node tests/sec-dep-20261029/regressions.cjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-20261102-contracts
          path: |
            ${{ runner.temp }}/sec-20261102-evidence/
            ${{ runner.temp }}/g01-evidence/identity.json
          if-no-files-found: warn
          retention-days: 7
