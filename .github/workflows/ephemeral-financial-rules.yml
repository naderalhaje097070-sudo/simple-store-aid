name: Ephemeral Financial Rules

on:
  push:
    branches:
      - ops/ephemeral-financial-tests
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  financial-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Verify Supabase CLI version
        shell: bash
        run: |
          set -euo pipefail
          actual="$(supabase --version)"
          test "$actual" = "2.101.0"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            echo "SEC_CI_INFRA_FAIL: isolated Supabase failed to start; raw startup output withheld"
            exit 1
          fi

      - name: Capture and verify isolated Supabase environment
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a

          case "$API_URL" in
            http://127.0.0.1:54321|http://localhost:54321) ;;
            *)
              echo "SEC_CI_ISOLATION_FAIL: API_URL is not the approved loopback target"
              exit 1
              ;;
          esac

          case "$DB_URL" in
            postgresql://*@127.0.0.1:54322/*|postgresql://*@localhost:54322/*|postgres://*@127.0.0.1:54322/*|postgres://*@localhost:54322/*) ;;
            *)
              echo "SEC_CI_ISOLATION_FAIL: DB_URL is not the approved loopback target"
              exit 1
              ;;
          esac

          echo "::add-mask::$ANON_KEY"
          if [[ -n "${SERVICE_ROLE_KEY:-}" ]]; then
            echo "::add-mask::$SERVICE_ROLE_KEY"
          fi
          echo "::add-mask::$DB_URL"
          echo "CI_ISOLATED_SUPABASE=1" >> "$GITHUB_ENV"

      - name: Seed test owner and tenant
        shell: bash
        run: |
          set -euo pipefail
          test "${CI_ISOLATED_SUPABASE:-}" = "1"
          set -a
          source /tmp/supabase.env
          set +a

          curl --fail-with-body --silent --show-error \
            -X POST "$API_URL/auth/v1/signup" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"pilot.qa@mongezz.test","password":"PilotQA-Only-2026!","data":{"display_name":"Pilot QA"}}' \
            > /tmp/signup.json

          USER_ID="$(jq -r '.user.id // .id // empty' /tmp/signup.json)"
          if [[ -z "$USER_ID" ]]; then
            USER_ID="$(psql "$DB_URL" -Atc "select id from auth.users where email='pilot.qa@mongezz.test' limit 1")"
          fi
          test -n "$USER_ID"

          TENANT_ID="11111111-1111-4111-8111-111111111111"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v uid="$USER_ID" -v tid="$TENANT_ID" <<'SQL'
          INSERT INTO public.tenants (id, name, owner_user_id)
          VALUES (:'tid'::uuid, 'Pilot QA Tenant', :'uid'::uuid);

          INSERT INTO public.profiles (id, tenant_id, display_name)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'Pilot QA')
          ON CONFLICT (id) DO UPDATE
          SET tenant_id = EXCLUDED.tenant_id,
              display_name = EXCLUDED.display_name;

          INSERT INTO public.user_roles (user_id, tenant_id, role)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'owner')
          ON CONFLICT DO NOTHING;
          SQL

      - name: Run T1-T15 financial regression suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash tests/financial-rules/run.sh

      - name: Write concise CI summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Ephemeral Financial Rules"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Status: **${JOB_STATUS}**"
            echo "- Supabase CLI: \`2.101.0\`"
            echo "- Environment: isolated loopback Supabase"
            echo "- Production database accessed: **No**"
            echo "- Raw infrastructure logs published: **No**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show redacted diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "SEC_CI_DIAGNOSTIC: isolated financial workflow failed; raw environment/startup output withheld"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup > /dev/null 2>&1 || true
