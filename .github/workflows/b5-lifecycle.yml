name: B5 composed fixed-source lifecycle acceptance
'on':
  push:
    branches:
    - integration/g0-g1-reconcile-2026-10-18
    paths:
    - tests/b5-lifecycle/**
    - .github/workflows/b5-lifecycle.yml
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode:
        - fresh
        - upgrade
    env:
      EXPECTED_SOURCE: ${{ github.sha }}
      CONTRACT_MODE: ${{ matrix.mode }}
      MONGEZZ_DEPLOY_TARGET: ci
      MONGEZZ_E2E_WRITE_TEST: '1'
      CI_ISOLATED_SUPABASE: '1'
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: b5-preflight-placeholder
      PGHOST: 127.0.0.1
      PGPORT: '54322'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.14
    - name: Exact source, B50/original41 identity and negative evidence controls
      run: 'python tests/b5-lifecycle/inventory.py

        PYTHONDONTWRITEBYTECODE=1 python tests/b5-lifecycle/test_contract.py

        bun install --frozen-lockfile'
    - uses: supabase/setup-cli@v2
      with:
        version: 2.101.0
    - name: Discover pinned CLI and validate existing isolation guard
      run: 'set -euo pipefail

        test "$(supabase --version)" = ''2.101.0''

        supabase --help > "$RUNNER_TEMP/b5-cli-help.txt"

        supabase start --help > "$RUNNER_TEMP/b5-start-help.txt"

        supabase migration up --help > "$RUNNER_TEMP/b5-up-help.txt"

        supabase stop --help > "$RUNNER_TEMP/b5-stop-help.txt"

        grep -q -- ''--local'' "$RUNNER_TEMP/b5-up-help.txt"

        grep -q -- ''--no-backup'' "$RUNNER_TEMP/b5-stop-help.txt"

        python tests/e2e/write_harness_guard.py --preflight-only

        sudo apt-get update -qq

        sudo apt-get install -y postgresql-client iptables > "$RUNNER_TEMP/b5-prerequisites-private.log" 2>&1'
    - name: Credential-free dedicated app UID and native redirect preflight
      run: "set -euo pipefail\nsudo useradd --system --no-create-home --shell /usr/sbin/nologin mcp-route\nuid=\"\
        $(id -u mcp-route)\"\nsudo iptables -N MCP_ROUTE\nsudo iptables -A MCP_ROUTE -o lo -d 127.0.0.1/32 -j ACCEPT\n\
        sudo iptables -A MCP_ROUTE -j REJECT --reject-with icmp-port-unreachable\nsudo iptables -I OUTPUT 1 -m owner\
        \ --uid-owner \"$uid\" -j MCP_ROUTE\nsudo ip6tables -I OUTPUT 1 -m owner --uid-owner \"$uid\" -j REJECT\n\
        sudo install -d -m 755 -o mcp-route -g mcp-route /tmp/monjez-tanstack-route\nsudo install -m 644 tests/account-lifecycle/oc_app_guard.mjs\
        \ /tmp/monjez-tanstack-route/guard.mjs\ncmp tests/account-lifecycle/oc_app_guard.mjs /tmp/monjez-tanstack-route/guard.mjs\n\
        sudo -u mcp-route env -i PATH=/usr/bin:/bin CI_ISOLATED_SUPABASE=1 \\\n  LOVABLE_API_KEY=oc-app-dummy PADDLE_SANDBOX_API_KEY=oc-app-dummy\
        \ PADDLE_LIVE_API_KEY=oc-app-dummy \\\n  MCP_ROUTE_PREFLIGHT=1 MCP_ROUTE_STATE=/tmp/monjez-tanstack-route/preflight.json\
        \ \\\n  \"$(command -v node)\" --import /tmp/monjez-tanstack-route/guard.mjs --input-type=module -e ''\n\
        ROUTE_UID=\"$uid\" python - <<'PYFIREWALL'\nimport json,os,subprocess\nfrom pathlib import Path\nlines=subprocess.check_output(['sudo','iptables','-nvxL','MCP_ROUTE'],text=True)\n\
        rejects=[int(s.split()[0]) for s in lines.splitlines() if 'REJECT' in s]\nassert len(rejects)==1 and rejects[0]>0\n\
        subprocess.run(['sudo','ip6tables','-C','OUTPUT','-m','owner','--uid-owner',os.environ['ROUTE_UID'],'-j','REJECT'],check=True)\n\
        r={'uid':int(os.environ['ROUTE_UID']),'ipv4_reject_packets':rejects[0],'ipv6_rule_installed':True,'credential_free_preflight':True}\n\
        (Path(os.environ['RUNNER_TEMP'])/'route-firewall.json').write_text(json.dumps(r))\nPYFIREWALL"
    - name: Start disposable original41 or current50 with real local OAuth
      run: "set -euo pipefail\numask 077\nstack=\"$RUNNER_TEMP/monjez-tanstack-route\"\nmkdir -p \"$stack\"\nsupabase\
        \ --workdir \"$stack\" init > \"$RUNNER_TEMP/b5-init-private.log\" 2>&1\nSTACK_CONFIG=\"$stack/supabase/config.toml\"\
        \ python - <<'PYCONFIG'\nimport os\nfrom pathlib import Path\np=Path(os.environ['STACK_CONFIG']);s=p.read_text()\n\
        old='[auth.oauth_server]\\n# Enable OAuth server functionality\\nenabled = false'\nassert old in s\np.write_text(s.replace(old,old.replace('enabled\
        \ = false','enabled = true'),1))\nPYCONFIG\nB5_STACK=\"$stack\" python - <<'PYMIGRATIONS'\nimport json,os,shutil\n\
        from pathlib import Path\nm=json.loads(Path('tests/g01-acceptance/integrated-b-source.json').read_text())\n\
        paths=sorted(m['original54_migrations'] if os.environ['CONTRACT_MODE']=='upgrade' else m['integrated_migrations'])\n\
        assert len(paths)==(41 if os.environ['CONTRACT_MODE']=='upgrade' else 50)\nout=Path(os.environ['B5_STACK'])/'supabase/migrations';out.mkdir(parents=True,exist_ok=True)\n\
        for path in paths:shutil.copy2(path,out/Path(path).name)\nPYMIGRATIONS\nif ! supabase --workdir \"$stack\"\
        \ start > \"$RUNNER_TEMP/b5-start-private.log\" 2>&1; then\n  echo 'B5_DISPOSABLE_STACK_FAILED_PRIVATE_LOG_WITHHELD'\n\
        \  exit 1\nfi\nsupabase --workdir \"$stack\" status -o json > \"$RUNNER_TEMP/route-status.json\"\nchmod\
        \ 600 \"$RUNNER_TEMP/route-status.json\""
    - name: Build actual standalone app and retain exact source
      run: 'python tests/account-lifecycle/tanstack_route_build.py

        python tests/b5-lifecycle/inventory.py'
    - name: Composed populated REST RPC MCP price and account transitions
      run: "python tests/b5-lifecycle/composed.py --status-file \"$RUNNER_TEMP/route-status.json\" \\\n --evidence-dir\
        \ \"$RUNNER_TEMP/route-evidence\" --expected-source \"$EXPECTED_SOURCE\" --mode \"$CONTRACT_MODE\"\npython\
        \ tests/b5-lifecycle/inventory.py\ngit diff --exit-code"
    - name: Remove isolated processes credentials and stack; quarantine unsafe evidence
      run: "set -euo pipefail\nif id mcp-route >/dev/null 2>&1; then sudo pkill -TERM -u mcp-route || true; fi\n\
        if [[ -d \"$RUNNER_TEMP/monjez-tanstack-route/supabase\" ]]; then\n supabase --workdir \"$RUNNER_TEMP/monjez-tanstack-route\"\
        \ stop --no-backup > \"$RUNNER_TEMP/b5-stop-private.log\" 2>&1\nfi\npython - <<'PYCLEAN'\nimport json,os,re,shutil,subprocess,sys\n\
        from pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP']);out=root/'route-evidence';out.mkdir(exist_ok=True)\n\
        status=root/'route-status.json';forbidden=[]\nif status.exists():\n d=json.loads(status.read_text());forbidden=[v\
        \ for k,v in d.items() if ('KEY' in k or 'PASSWORD' in k) and isinstance(v,str) and v]\ntry:\n for p in\
        \ out.rglob('*'):\n  if p.is_file():\n   s=p.read_text(errors='replace')\n   if any(x in s for x in forbidden)\
        \ or re.search(r'eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}|sb_(?:secret|publishable)_[A-Za-z0-9_-]{8,}',s):\n\
        \    shutil.move(str(out),str(root/'b5-private-quarantine'));raise RuntimeError('B5_PUBLICATION_QUARANTINED')\n\
        finally:\n status.unlink(missing_ok=True)\n subprocess.run(['sudo','rm','-rf','/tmp/monjez-tanstack-route'],check=True)\n\
        uid=subprocess.run(['id','-u','mcp-route'],capture_output=True,text=True)\nprocesses_removed=uid.returncode!=0\
        \ or subprocess.run(['pgrep','-u','mcp-route'],capture_output=True).returncode==1\ncontainers=subprocess.check_output(['docker','ps','--format','{{.Names}}'],text=True)\n\
        receipt={'source':os.environ['EXPECTED_SOURCE'],'status_removed':not status.exists(),'runtime_removed':not\
        \ Path('/tmp/monjez-tanstack-route').exists(),'processes_removed':processes_removed,'stack_removed':'monjez-tanstack-route'\
        \ not in containers,'credential_scan_pass':True}\n(out/'cleanup.json').write_text(json.dumps(receipt,indent=2)+'\\\
        n')\nassert all(v for k,v in receipt.items() if k!='source')\nprint('B5_CLEANUP '+json.dumps(receipt))\n\
        PYCLEAN"
      if: always()
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: b5-lifecycle-${{ matrix.mode }}-attempt${{ github.run_attempt }}
        path: ${{ runner.temp }}/route-evidence/
        retention-days: 7
        if-no-files-found: warn
  ssr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: ${{ github.sha }}
      MONGEZZ_DEPLOY_TARGET: ci
      CI_ISOLATED_SUPABASE: '1'
      MONGEZZ_E2E_WRITE_TEST: '1'
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: g01-preflight-placeholder
      PGHOST: 127.0.0.1
      PGPORT: '54322'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout exact acceptance source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Setup maintained Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Setup existing Bun runtime
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.14
    - name: Prove reviewed integrated source and original41 migration identities
      run: 'python tests/g01-acceptance/capture.py identity

        python tests/g01-acceptance/test_integrated_identity.py

        python tests/g01-acceptance/test_g1_contracts.py

        python tests/g01-acceptance/test_cleanup.py


        python tests/b5-lifecycle/inventory.py

        python tests/b5-lifecycle/test_contract.py'
    - name: Frozen existing runtime dependencies
      run: python tests/g01-acceptance/capture.py frozen
    - name: Pinned browser tools
      run: 'python -m pip install -r tests/gate4/sec-env/requirements.txt > "$RUNNER_TEMP/g01-browser-install-private.log"
        2>&1

        python -m playwright install chromium --only-shell --with-deps >> "$RUNNER_TEMP/g01-browser-install-private.log"
        2>&1'
    - name: Pinned existing emulator test tool
      run: 'npm install --prefix /tmp/g01-tools wrangler@4.149.0 --no-audit --no-fund > "$RUNNER_TEMP/g01-emulator-install-private.log"
        2>&1

        node /tmp/g01-tools/node_modules/wrangler/bin/wrangler.js --help > "$RUNNER_TEMP/g01-wrangler-help.txt"'
    - name: Verify official cf-fetch opt-out on actual installed bundle before credentials
      run: node tests/g01-acceptance/test_cf_fetch.cjs
    - name: Checkout exact observed official CLI installer
      uses: actions/checkout@v4
      with:
        repository: supabase/setup-cli
        ref: afb1b15109756ea5cf9d8985a359d9095235ca2b
        path: .g01-cli-action
        persist-credentials: false
    - name: Same installer Bun as failed run
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.10
    - name: Frozen official installer dependencies
      timeout-minutes: 2
      working-directory: .g01-cli-action
      run: bun install --frozen-lockfile --production
    - name: Diagnose pinned CLI installer with bounded phase evidence
      timeout-minutes: 3
      run: python tests/g01-acceptance/diagnose_cli.py
    - name: Install local database and firewall tools
      run: 'sudo apt-get update -qq

        sudo apt-get install -y postgresql-client iptables strace libssl-dev > "$RUNNER_TEMP/g01-native-install-private.log"
        2>&1'
    - name: Verify pointer-only tracer before credentials
      run: 'python tests/g01-acceptance/test_process_map.py

        python tests/g01-acceptance/test_egress_trace.py

        python tests/g01-acceptance/test_egress_trace.py --live-strace

        '
    - name: Validate scope and native containment before credentials
      shell: bash
      run: 'set -euo pipefail

        test "$(supabase --version)" = 2.101.0

        supabase --help > "$RUNNER_TEMP/g01-cli-help.txt"

        python tests/e2e/write_harness_guard.py --preflight-only

        sudo useradd --system --create-home --home-dir /tmp/g01-app --shell /usr/sbin/nologin g01-app

        uid="$(id -u g01-app)"

        sudo iptables -N G01_APP

        sudo iptables -A G01_APP -o lo -d 127.0.0.1/32 -j ACCEPT

        sudo iptables -A G01_APP -j REJECT --reject-with icmp-port-unreachable

        sudo iptables -I OUTPUT 1 -m owner --uid-owner "$uid" -j G01_APP

        sudo ip6tables -I OUTPUT 1 -m owner --uid-owner "$uid" -j REJECT

        set +e

        sudo -u g01-app env -i PATH=/usr/bin:/bin curl --noproxy ''*'' --connect-timeout 2 http://198.51.100.1/g01-canary
        > /dev/null 2>&1

        canary_status=$?

        set -e

        test "$canary_status" = 7

        sudo ip6tables -C OUTPUT -m owner --uid-owner "$uid" -j REJECT

        chmod -R a+rX /tmp/g01-tools

        '
    - name: Fresh independently anchored B50 schema for SSR
      shell: bash
      run: "set -euo pipefail\numask 077\nstack=\"$RUNNER_TEMP/g01-stack\"\nmkdir -p \"$stack\"\nsupabase --workdir\
        \ \"$stack\" init > \"$RUNNER_TEMP/g01-init-private.log\" 2>&1\nmkdir -p \"$stack/supabase/migrations\"\n\
        cp supabase/migrations/*.sql \"$stack/supabase/migrations/\"\nif ! supabase --workdir \"$stack\" start >\
        \ \"$RUNNER_TEMP/g01-start-private.log\" 2>&1; then\n  echo 'G01_LOCAL_STACK_FAILED: private output withheld'\n\
        \  exit 1\nfi\nsupabase --workdir \"$stack\" status -o json > \"$RUNNER_TEMP/g01-status.json\"\nchmod 600\
        \ \"$RUNNER_TEMP/g01-status.json\"\n"
    - name: Actual Cloudflare SSR target agreement and nonfinancial Auth UI
      run: python tests/b5-lifecycle/ssr_runtime.py
    - name: Remove isolated processes containers and credentials
      if: always()
      shell: bash
      run: 'set -euo pipefail

        if id g01-app >/dev/null 2>&1; then sudo pkill -TERM -u g01-app || true; fi

        sudo rm -f /tmp/g01-runtime/worker.env

        rm -f "$RUNNER_TEMP/g01-status.json"

        if [[ -d "$RUNNER_TEMP/g01-stack/supabase" ]]; then supabase --workdir "$RUNNER_TEMP/g01-stack" stop --no-backup
        > "$RUNNER_TEMP/g01-stop-private.log" 2>&1; fi

        mkdir -p "$RUNNER_TEMP/g01-evidence"

        python tests/g01-acceptance/cleanup.py

        '
    - name: Quarantine any credential-bearing evidence
      if: always()
      run: "python - <<'PYSCAN'\nimport os,re,shutil\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP']);out=root/'g01-evidence';out.mkdir(exist_ok=True)\n\
        for p in out.rglob('*'):\n if p.is_file() and re.search(r'eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}|sb_(?:secret|publishable)_[A-Za-z0-9_-]{8,}',p.read_text(errors='replace')):\n\
        \  shutil.move(str(out),str(root/'g01-evidence-private-quarantine'));raise SystemExit('G01_EVIDENCE_QUARANTINED')\n\
        print('G01_EVIDENCE_CREDENTIAL_SCAN_PASS')\nPYSCAN\n"
    - name: Upload bounded evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: b5-ssr-attempt${{ github.run_attempt }}
        path: ${{ runner.temp }}/g01-evidence/
        retention-days: 7
        if-no-files-found: warn
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode:
        - fresh
    env:
      EXPECTED_SOURCE: ${{ github.sha }}
      CONTRACT_MODE: ${{ matrix.mode }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.14
    - name: Frozen install and signed handler controls
      run: 'python tests/b5-lifecycle/inventory.py

        git cat-file -e dc0ced4fcf20947ccaa603a3e4b5cc16f5b8f0a0:src/routes/api/public/payments/webhook.ts

        bun install --frozen-lockfile

        node --test tests/account-lifecycle/webhook_handler.test.cjs

        '
    - uses: supabase/setup-cli@v2
      with:
        version: 2.101.0
    - name: Discover pinned CLI operations
      run: 'set -euo pipefail

        test "$(supabase --version)" = ''2.101.0''

        supabase start --help > "$RUNNER_TEMP/start-help.txt"

        supabase stop --help > "$RUNNER_TEMP/stop-help.txt"

        supabase migration up --help > "$RUNNER_TEMP/up-help.txt"

        supabase db advisors --help > "$RUNNER_TEMP/advisors-help.txt"

        supabase migration list --help > "$RUNNER_TEMP/list-help.txt"

        grep -q -- ''--local'' "$RUNNER_TEMP/up-help.txt"

        grep -q -- ''--no-backup'' "$RUNNER_TEMP/stop-help.txt"

        sudo apt-get update -qq

        sudo apt-get install -y postgresql-client iptables > "$RUNNER_TEMP/prerequisites.log" 2>&1

        '
    - name: Restrict probe UID before credentials
      shell: bash
      run: "set -euo pipefail\nsudo useradd --system --no-create-home --shell /usr/sbin/nologin app02\nuid=\"$(id\
        \ -u app02)\"\nsudo iptables -N APP02\nsudo iptables -A APP02 -o lo -d 127.0.0.1/32 -p tcp -m multiport\
        \ --dports 54321,54322 -j ACCEPT\nsudo iptables -A APP02 -j REJECT --reject-with icmp-port-unreachable\n\
        sudo iptables -I OUTPUT 1 -m owner --uid-owner \"$uid\" -j APP02\nsudo ip6tables -I OUTPUT 1 -m owner --uid-owner\
        \ \"$uid\" -j REJECT\nsudo -u app02 \"$(command -v python)\" - <<'PY'\nimport socket\ntry:\n    with socket.create_connection(('1.1.1.1',443),timeout=3):\
        \ pass\nexcept OSError:\n    print('APP02_CREDENTIAL_FREE_EGRESS_REJECTED')\nelse:\n    raise SystemExit('APP02_FIREWALL_FAILED')\n\
        PY\nsudo install -d -m 711 -o app02 -g app02 /tmp/monjez-app02\nsudo cp -a \"$GITHUB_WORKSPACE/.\" /tmp/monjez-app02/repo\n\
        sudo install -d -m 700 -o app02 -g app02 /tmp/monjez-app02/evidence\nsudo chown -R app02:app02 /tmp/monjez-app02\n\
        sudo iptables -nvxL APP02 > \"$RUNNER_TEMP/firewall-before.txt\"\n"
    - name: Start disposable full chain
      shell: bash
      run: "set -euo pipefail\numask 077\nstack=\"$RUNNER_TEMP/monjez-app02-stack\"\nmkdir -p \"$stack\"\nsupabase\
        \ --workdir \"$stack\" init > \"$RUNNER_TEMP/init-private.log\" 2>&1\nmkdir -p \"$stack/supabase/migrations\"\
        \ncp supabase/migrations/*.sql \"$stack/supabase/migrations/\"\nif [[ \"$CONTRACT_MODE\" == upgrade ]];\
        \ then\n  rm \"$stack\"/supabase/migrations/*_webhook_persistence_01.sql \"$stack\"/supabase/migrations/*_webhook_bootstrap_01.sql\
        \ \"$stack\"/supabase/migrations/*_webhook_errors_01.sql\nfi\nif ! supabase --workdir \"$stack\" start >\
        \ \"$RUNNER_TEMP/start-private.log\" 2>&1; then\n  echo 'APP02_STACK_START_FAILURE_PRIVATE_LOG_WITHHELD'\n\
        \  exit 1\nfi\nsupabase --workdir \"$stack\" status -o json > \"$RUNNER_TEMP/status-private.json\"\nsudo\
        \ install -m 600 -o app02 -g app02 \"$RUNNER_TEMP/status-private.json\" /tmp/monjez-app02/status.json\n"
    - name: Baseline then populated local upgrade
      if: matrix.mode == 'upgrade'
      shell: bash
      run: "set -euo pipefail\ncd /tmp/monjez-app02/repo\nsudo -u app02 env -i PATH=\"$PATH\" PYTHONDONTWRITEBYTECODE=1\
        \ \\\n  EXPECTED_SOURCE=\"$EXPECTED_SOURCE\" MONGEZZ_DEPLOY_TARGET=ci MONGEZZ_E2E_WRITE_TEST=1 CI_ISOLATED_SUPABASE=1\
        \ \\\n  VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY=app02-preflight-placeholder\
        \ \\\n  PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres \\\n  python\
        \ tests/account-lifecycle/webhook_persistence_probe.py --expected-source \"$EXPECTED_SOURCE\" \\\n    --status-file\
        \ /tmp/monjez-app02/status.json --evidence-dir /tmp/monjez-app02/evidence \\\n    --private-state /tmp/monjez-app02/private-state.json\
        \ --phase before\ncp supabase/migrations/*_webhook_persistence_01.sql supabase/migrations/*_webhook_bootstrap_01.sql\
        \ supabase/migrations/*_webhook_errors_01.sql \"$RUNNER_TEMP/monjez-app02-stack/supabase/migrations/\"\n\
        supabase --workdir \"$RUNNER_TEMP/monjez-app02-stack\" migration up --local > \"$RUNNER_TEMP/upgrade-private.log\"\
        \ 2>&1\n"
    - name: Actual authorization and invariance
      shell: bash
      run: "set -euo pipefail\ncd /tmp/monjez-app02/repo\nsudo -u app02 env -i PATH=\"$PATH\" PYTHONDONTWRITEBYTECODE=1\
        \ \\\n  EXPECTED_SOURCE=\"$EXPECTED_SOURCE\" MONGEZZ_DEPLOY_TARGET=ci MONGEZZ_E2E_WRITE_TEST=1 CI_ISOLATED_SUPABASE=1\
        \ \\\n  VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY=app02-preflight-placeholder\
        \ \\\n  PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres \\\n  python\
        \ tests/account-lifecycle/webhook_persistence_probe.py --expected-source \"$EXPECTED_SOURCE\" \\\n    --status-file\
        \ /tmp/monjez-app02/status.json --evidence-dir /tmp/monjez-app02/evidence \\\n    --private-state /tmp/monjez-app02/private-state.json\
        \ --phase after\n"
    - name: Runtime image identity
      shell: bash
      run: 'set -euo pipefail

        docker ps --format ''{{.Image}}'' | sort -u > "$RUNNER_TEMP/runtime-images.txt"

        sudo install -m 600 -o app02 -g app02 "$RUNNER_TEMP/runtime-images.txt" /tmp/monjez-app02/evidence/runtime-images.txt

        '
    - name: Local migration history and advisor availability
      shell: bash
      run: "set -euo pipefail\nsupabase --workdir \"$RUNNER_TEMP/monjez-app02-stack\" migration list --local > \"\
        $RUNNER_TEMP/migrations.txt\"\nsudo install -m 600 -o app02 -g app02 \"$RUNNER_TEMP/migrations.txt\" /tmp/monjez-app02/evidence/migrations.txt\n\
        if grep -q -- '--local' \"$RUNNER_TEMP/advisors-help.txt\"; then\n  supabase --workdir \"$RUNNER_TEMP/monjez-app02-stack\"\
        \ db advisors --local > \"$RUNNER_TEMP/advisors-private.txt\" 2>&1\n  sudo install -m 600 -o app02 -g app02\
        \ \"$RUNNER_TEMP/advisors-private.txt\" /tmp/monjez-app02/evidence/advisors.txt\nelse\n  echo 'APP02_OFFICIAL_ADVISOR_LOCAL_MODE_UNAVAILABLE_NO_REMOTE_FALLBACK'\n\
        \  echo 'local advisor unavailable; no remote fallback' | sudo -u app02 tee /tmp/monjez-app02/evidence/advisors-unavailable.txt\n\
        fi\n"
    - name: Cleanup and safe final receipts
      id: publication
      if: always()
      shell: bash
      run: "set -euo pipefail\nout=\"$RUNNER_TEMP/app02-evidence\"\nmkdir -p \"$out\"\nif [[ -d /tmp/monjez-app02/evidence\
        \ ]]; then\n  sudo cp -a /tmp/monjez-app02/evidence/. \"$out/\"\n  sudo chown -R \"$(id -un):$(id -gn)\"\
        \ \"$out\"\nfi\nrm -f \"$RUNNER_TEMP/status-private.json\" \"$RUNNER_TEMP/start-private.log\"\nif [[ -d\
        \ \"$RUNNER_TEMP/monjez-app02-stack/supabase\" ]]; then\n  supabase --workdir \"$RUNNER_TEMP/monjez-app02-stack\"\
        \ stop --no-backup > \"$RUNNER_TEMP/stop-private.log\" 2>&1\nfi\npython - <<'PY'\nimport json,os,subprocess,sys\n\
        from pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP']);out=root/'app02-evidence'\ndef rejects(path):\n\
        \    return sum(int(x.split()[0]) for x in path.splitlines() if 'REJECT' in x)\nbefore=rejects((root/'firewall-before.txt').read_text())\n\
        after=rejects(subprocess.check_output(['sudo','iptables','-nvxL','APP02'],text=True))\nuid=subprocess.check_output(['id','-u','app02'],text=True).strip()\n\
        v6=sum(int(x.split()[0]) for x in subprocess.check_output(['sudo','ip6tables','-nvxL','OUTPUT'],text=True).splitlines()\n\
        \       if 'REJECT' in x and ('owner UID match '+uid) in x)\ncleanup={'source':os.environ['EXPECTED_SOURCE'],'credential_free_canary_rejected':before>0,\n\
        \         'unexpected_ipv4_rejects':after-before,'ipv6_rejects':v6,\n         'status_removed':not Path('/tmp/monjez-app02/status.json').exists(),\n\
        \         'state_removed':not Path('/tmp/monjez-app02/private-state.json').exists(),\n         'stack_removed':'monjez-app02-stack'\
        \ not in subprocess.check_output(['docker','ps','--format','{{.Names}}'],text=True)}\n(out/'cleanup.json').write_text(json.dumps(cleanup,indent=2)+'\\\
        n')\nsys.path.insert(0,'tests/account-lifecycle')\nfrom scanner_evidence import verify_publication, PublicationBlocked\n\
        forbidden=[]\nfor filename in ['status.json','private-state.json']:\n    p=Path('/tmp/monjez-app02')/filename\n\
        \    if p.exists():\n        raw=subprocess.check_output(['sudo','cat',str(p)],text=True)\n        data=json.loads(raw)\n\
        \        if filename=='status.json':\n            forbidden += [v for k,v in data.items() if 'KEY' in k\
        \ or 'PASSWORD' in k]\n        else:\n            forbidden += [v for actor in data.get('actors',{}).values()\
        \ for k,v in actor.items()\n                          if k in ('token','refresh','password','email')]\n\
        try:\n    verify_publication(out,root/'app02-private-quarantine',forbidden)\nexcept PublicationBlocked:\n\
        \    print('APP02_PUBLICATION_BLOCKED '+(out/'publication-blocked.json').read_text())\n    raise\nfinally:\n\
        \    subprocess.run(['sudo','rm','-f','/tmp/monjez-app02/status.json','/tmp/monjez-app02/private-state.json'],check=True)\n\
        cleanup['status_removed']=not Path('/tmp/monjez-app02/status.json').exists()\ncleanup['state_removed']=not\
        \ Path('/tmp/monjez-app02/private-state.json').exists()\n(out/'cleanup.json').write_text(json.dumps(cleanup,indent=2)+'\\\
        n')\nprint('APP02_CLEANUP '+json.dumps(cleanup))\nassert before>0 and after==before and v6==0 and cleanup['status_removed']\
        \ and cleanup['state_removed'] and cleanup['stack_removed']\nPY\necho 'safe=true' >> \"$GITHUB_OUTPUT\"\n"
    - uses: actions/upload-artifact@v4
      if: always() && steps.publication.outputs.safe == 'true'
      with:
        name: b5-signed-billing-${{ matrix.mode }}-attempt${{ github.run_attempt }}
        path: ${{ runner.temp }}/app02-evidence/
        retention-days: 7
