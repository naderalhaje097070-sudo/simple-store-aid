name: SEC-ENV Gate 4 Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  environment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Run target-green environment isolation probe
        shell: bash
        run: |
          set -euo pipefail
          bun tests/gate4/sec-env/probe.ts > /tmp/sec-env-g4.log 2>&1
          cat /tmp/sec-env-g4.log

          grep -Fq \
            "SEC_ENV_G4_TARGET_GREEN: explicit deployment contract fails closed and isolates non-production" \
            /tmp/sec-env-g4.log || {
              echo "SEC_ENV_G4_HARNESS_FAIL: exact target-green sentinel missing"
              exit 1
            }

          for unexpected in \
            SEC_ENV_G4_E1_EXPECTED_RED \
            SEC_ENV_G4_E2_EXPECTED_RED \
            SEC_ENV_G4_E3_EXPECTED_RED
          do
            if grep -Fq "$unexpected" /tmp/sec-env-g4.log; then
              echo "SEC_ENV_G4_HARNESS_FAIL: stale expected-red sentinel present: $unexpected"
              exit 1
            fi
          done

          echo "SEC_ENV_G4_TARGET_GREEN_CONFIRMED"
