name: Historical 43 - MCP Lifecycle Probe
'on':
  workflow_dispatch:
    inputs:
      historical_source:
        description: Explicit 40-hex repository commit for historical 43-migration benchmark, not current B50 acceptance
        required: true
        type: string
permissions:
  contents: read
jobs:
  mcp-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: ${{ inputs.historical_source }}
      MONGEZZ_DEPLOY_TARGET: ci
      MONGEZZ_E2E_WRITE_TEST: '1'
      CI_ISOLATED_SUPABASE: '1'
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: mcp-preflight-placeholder
      PGHOST: 127.0.0.1
      PGPORT: '54322'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Validate explicit historical benchmark provenance before checkout
      run: 'python - <<''PYHISTORY''

        import os,re,json

        source=os.environ[''HISTORICAL_SOURCE'']

        assert re.fullmatch(''[0-9a-f]{40}'',source), ''Full historical commit SHA required''

        print(json.dumps({''scope'':''historical benchmark only; not B50 PR acceptance'',''historical_source'':source,''routing_source'':os.environ[''HISTORICAL_ROUTING_SOURCE'']}))

        PYHISTORY'
    - name: Checkout exact candidate
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.historical_source }}
        persist-credentials: false
    - name: Verify historical checkout and phase inventory before credentials
      run: 'python - <<''PYPHASE''

        import os,subprocess,json

        from pathlib import Path

        source=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()

        assert source==os.environ[''HISTORICAL_SOURCE''], ''Historical source mismatch''

        files=sorted(Path(''supabase/migrations'').glob(''*.sql''))

        assert len(files)==43, ''Selected commit does not match historical schema phase''

        subprocess.run([''git'',''diff'',''--quiet'',''HEAD'',''--''],check=True)

        print(json.dumps({''scope'':''historical only'',''source'':source,''migration_count'':len(files)}))

        PYPHASE'
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check MCP oracle safety
      run: python -m unittest discover -s tests/account-lifecycle -p test_mcp_probe.py -v
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.14
    - name: Install exact locked application dependencies
      run: bun install --frozen-lockfile > "$RUNNER_TEMP/mcp-install.log" 2>&1
    - name: Setup pinned Supabase CLI
      uses: supabase/setup-cli@v2
      with:
        version: 2.101.0
    - name: Inspect CLI and validate isolated intent
      shell: bash
      run: 'set -euo pipefail

        test "$(supabase --version)" = ''2.101.0''

        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

        supabase --help > "$RUNNER_TEMP/mcp-cli-help.txt"

        grep -q -- ''--workdir'' "$RUNNER_TEMP/mcp-cli-help.txt"

        supabase start --help > "$RUNNER_TEMP/mcp-start-help.txt"

        python tests/e2e/write_harness_guard.py --preflight-only

        '
    - name: Install PostgreSQL client
      run: 'sudo apt-get update -qq

        sudo apt-get install -y postgresql-client > "$RUNNER_TEMP/mcp-psql-install.log" 2>&1

        '
    - name: Start fresh disposable stack
      shell: bash
      run: "set -euo pipefail\numask 077\nstack=\"$RUNNER_TEMP/monjez-mcp-lifecycle\"\nmkdir -p \"$stack\"\nsupabase\
        \ --workdir \"$stack\" init > \"$RUNNER_TEMP/mcp-init.log\" 2>&1\n# Enable the already-supported OAuth server\
        \ only in this disposable test config.\n# Keep dynamic registration disabled; clients are created by fixture\
        \ administration.\nSTACK_CONFIG=\"$stack/supabase/config.toml\" python - <<'PYCONFIG'\nimport os\nfrom pathlib\
        \ import Path\np = Path(os.environ['STACK_CONFIG'])\ns = p.read_text()\nold = '[auth.oauth_server]\\n# Enable\
        \ OAuth server functionality\\nenabled = false'\nassert old in s, 'Pinned CLI OAuth configuration changed'\n\
        p.write_text(s.replace(old, old.replace('enabled = false', 'enabled = true'), 1))\nPYCONFIG\nmkdir -p \"\
        $stack/supabase/migrations\"\ncp supabase/migrations/*.sql \"$stack/supabase/migrations/\"\nif ! supabase\
        \ --workdir \"$stack\" start > \"$RUNNER_TEMP/mcp-start.log\" 2>&1; then\n  echo 'MCP_STACK_START_FAILURE:\
        \ private setup output withheld'\n  exit 1\nfi\nsupabase --workdir \"$stack\" status -o json > \"$RUNNER_TEMP/mcp-status.json\"\
        \nchmod 600 \"$RUNNER_TEMP/mcp-status.json\"\n"
    - name: Run actual application MCP probe
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/mcp-evidence\"\ndocker ps --format '{{.Image}}' > \"$RUNNER_TEMP/mcp-evidence/runtime-images.txt\"\
        \npython tests/account-lifecycle/mcp_probe.py \\\n  --status-file \"$RUNNER_TEMP/mcp-status.json\" \\\n\
        \  --evidence-dir \"$RUNNER_TEMP/mcp-evidence\" \\\n  --expected-source \"$EXPECTED_SOURCE\"\n"
    - name: Print allowlisted sanitized receipt
      if: always()
      run: "if [[ -f \"$RUNNER_TEMP/mcp-evidence/runtime-images.txt\" ]]; then\n  cat \"$RUNNER_TEMP/mcp-evidence/runtime-images.txt\"\
        \nfi\nif [[ -f \"$RUNNER_TEMP/mcp-evidence/mcp-result.json\" ]]; then\n  cat \"$RUNNER_TEMP/mcp-evidence/mcp-result.json\"\
        \nfi\nif [[ -f \"$RUNNER_TEMP/mcp-evidence/progress.json\" ]]; then\n  cat \"$RUNNER_TEMP/mcp-evidence/progress.json\"\
        \nfi\n"
    - name: Upload sanitized MCP evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mcp-lifecycle-attempt${{ github.run_attempt }}
        path: ${{ runner.temp }}/mcp-evidence/
        retention-days: 7
        if-no-files-found: warn
    - name: Stop disposable stack and remove keys
      if: always()
      shell: bash
      run: "rm -f \"$RUNNER_TEMP/mcp-status.json\" \"$RUNNER_TEMP/mcp-test-public-status.json\"\nif [[ -d \"$RUNNER_TEMP/monjez-mcp-lifecycle/supabase\"\
        \ ]]; then\n  supabase --workdir \"$RUNNER_TEMP/monjez-mcp-lifecycle\" stop --no-backup > \"$RUNNER_TEMP/mcp-stop.log\"\
        \ 2>&1\nfi\n"
    name: Historical 43 - mcp-lifecycle (${{ inputs.historical_source }})
env:
  HISTORICAL_SOURCE: ${{ inputs.historical_source }}
  HISTORICAL_ROUTING_SOURCE: ${{ github.sha }}
