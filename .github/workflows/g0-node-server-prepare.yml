name: G0 node-server official availability and lock preparation
on:
  push:
    branches: [test/g0-g1-acceptance-runtime-2026-10-14]
    paths: [.github/workflows/g0-node-server-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.14'
      - name: Starting frozen baseline and official npm availability
        run: |
          set -euo pipefail
          mkdir -p evidence/g0-node-server
          git rev-parse HEAD > evidence/g0-node-server/source.txt
          bun install --frozen-lockfile 2>&1 | tee evidence/g0-node-server/frozen-baseline.log
          git diff --exit-code -- package.json bun.lock
          node tests/g0-node-server/probe.cjs
          cp node_modules/@modelcontextprotocol/sdk/package.json evidence/g0-node-server/sdk-manifest.json
          node - <<'JS'
          const fs=require('node:fs'),semver=require('semver');
          const out='evidence/g0-node-server/';
          const selected=fs.readFileSync(out+'selected.txt','utf8').trim();
          const sdk=JSON.parse(fs.readFileSync(out+'sdk-manifest.json','utf8'));
          const candidate=JSON.parse(fs.readFileSync(out+'manifest-'+selected+'.json','utf8'));
          if(sdk.version!=='1.31.0'||!semver.satisfies(selected,sdk.dependencies['@hono/node-server']))throw Error('SDK change required: stop');
          if(candidate.engines?.node&&!semver.satisfies(process.version,candidate.engines.node))throw Error('Node incompatible');
          fs.writeFileSync(out+'parent-compatibility.json',JSON.stringify({sdk:sdk.version,range:sdk.dependencies['@hono/node-server'],selected,engines:candidate.engines,node:process.version},null,2));
          JS
      - name: Generate complete candidate lock without adopting root changes
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/evidence/g0-node-server"
          gen_dir="$(mktemp -d)"
          selected="$(cat "$out/selected.txt")"
          git show 5cbf198d88b0f091a30371676fb09abf92903dc8:bun.lock > "$gen_dir/bun.lock"
          cp package.json bunfig.toml "$gen_dir/"
          python - "$gen_dir/package.json" "$selected" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);d=json.loads(p.read_text())
          for key in ['overrides','resolutions']:d[key]['@hono/node-server']=sys.argv[2]
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          cd "$gen_dir"
          npm pack @oven/bun-linux-x64-baseline@1.4.0 --ignore-scripts --json > "$out/bun-tool-pack.json"
          node - "$out/bun-tool-pack.json" <<'JS'
          const fs=require('node:fs');const [p]=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(p.integrity!=='sha512-bX4PG7rWFkBL9laVJP8ESdQxkngLUyUiDEgYKohY+WtGQ2n8GSlA/2S5o394eEnacjQ/WC8+gebali7KoNvEpw==')throw Error('Unapproved generator integrity');
          JS
          tar -xzf oven-bun-linux-x64-baseline-1.4.0.tgz
          tool="$gen_dir/package/bin/bun"
          test "$("$tool" --version)" = 1.4.0
          "$tool" --revision | tee "$out/generator-revision.txt"
          grep -q 34cbb9a40 "$out/generator-revision.txt"
          timeout 120 "$tool" update @hono/node-server --lockfile-only --ignore-scripts 2>&1 | tee "$out/generator.log"
          cp bun.lock "$out/bun.lock"
          cp package.json bunfig.toml "$out/"
          sha256sum bun.lock package.json bunfig.toml > "$out/sha256.txt"
          git hash-object bun.lock > "$out/lock-blob.txt"
          cd "$GITHUB_WORKSPACE"
          git show 5cbf198d88b0f091a30371676fb09abf92903dc8:bun.lock > "$out/base-bun.lock"
          diff -u "$out/base-bun.lock" "$out/bun.lock" > "$out/lock.diff" || test "$?" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-node-server-preparation
          path: evidence/g0-node-server
          if-no-files-found: error
