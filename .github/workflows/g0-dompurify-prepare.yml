name: G0 DOMPurify browser baseline and lock preparation
on:
  push:
    branches: [test/g0-g1-acceptance-runtime-2026-10-14]
    paths: [.github/workflows/g0-dompurify-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.14'
      - name: Exact starting frozen baseline
        run: |
          set -euo pipefail
          mkdir -p evidence/g0-dompurify
          git rev-parse HEAD > evidence/g0-dompurify/source.txt
          bun install --frozen-lockfile 2>&1 | tee evidence/g0-dompurify/frozen-baseline.log
          git diff --exit-code -- package.json bun.lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned browser tooling
        run: |
          python -m pip install -r tests/gate4/sec-env/requirements.txt
          python -m playwright install chromium --only-shell --with-deps
      - name: Actual optional installed dependency and exact expected-red browser control
        run: |
          python tests/g0-dompurify/evidence.py installed 3.4.11
          python tests/g0-dompurify/browser.py baseline
      - name: Generate only DOMPurify using the approved official tool
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/evidence/g0-dompurify"
          gen_dir="$(mktemp -d)"
          git show 5623a6ea09101dfa97f36909a66d8ea3a81956f4:bun.lock > "$gen_dir/bun.lock"
          cp package.json bunfig.toml "$gen_dir/"
          python - "$gen_dir/package.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);d=json.loads(p.read_text())
          for key in ['overrides','resolutions']:d[key]['dompurify']='3.4.16'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          cd "$gen_dir"
          npm pack @oven/bun-linux-x64-baseline@1.4.0 --ignore-scripts --json > "$out/bun-tool-pack.json"
          node --input-type=module - "$out/bun-tool-pack.json" <<'JS'
          import fs from 'node:fs';
          const [p] = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.integrity !== 'sha512-bX4PG7rWFkBL9laVJP8ESdQxkngLUyUiDEgYKohY+WtGQ2n8GSlA/2S5o394eEnacjQ/WC8+gebali7KoNvEpw==') throw Error('Unapproved generator integrity');
          JS
          tar -xzf oven-bun-linux-x64-baseline-1.4.0.tgz
          tool="$gen_dir/package/bin/bun"
          test "$("$tool" --version)" = 1.4.0
          "$tool" --revision | tee "$out/generator-revision.txt"
          grep -q 34cbb9a40 "$out/generator-revision.txt"
          timeout 120 "$tool" update dompurify --lockfile-only --ignore-scripts 2>&1 | tee "$out/generator.log"
          cp bun.lock "$out/bun.lock"
          cp package.json bunfig.toml "$out/"
          sha256sum bun.lock package.json bunfig.toml > "$out/sha256.txt"
          git hash-object bun.lock > "$out/lock-blob.txt"
          cd "$GITHUB_WORKSPACE"
          git show 5623a6ea09101dfa97f36909a66d8ea3a81956f4:bun.lock > "$out/base-bun.lock"
          diff -u "$out/base-bun.lock" "$out/bun.lock" > "$out/lock.diff" || test "$?" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-dompurify-preparation
          path: evidence/g0-dompurify
          if-no-files-found: error
