name: MCP Issuer Contract
on:
  pull_request:
    paths:
      - '.github/workflows/mcp-issuer-contract.yml'
      - 'changes/mcp-local-issuer/**'
      - 'tests/unit/mcp-issuer*'
      - 'config/supabase-build-config.ts'
      - 'src/lib/mcp/index.ts'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.14'
      - run: bun install --frozen-lockfile
      - name: Verify locked SDK version
        run: test "$(bun -e 'console.log(require("./node_modules/@lovable.dev/mcp-js/package.json").version)')" = '0.20.1'
      - name: Validated actual application issuer regression
        run: bun test tests/unit/mcp-issuer.test.ts

