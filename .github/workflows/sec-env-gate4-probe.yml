name: SEC-ENV Gate 4 Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  environment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Run target-green environment isolation probe
        shell: bash
        run: |
          set -euo pipefail
          bun tests/gate4/sec-env/probe.ts > /tmp/sec-env-g4.log 2>&1
          cat /tmp/sec-env-g4.log

          grep -Fq \
            "SEC_ENV_G4_TARGET_GREEN: explicit deployment contract fails closed and isolates non-production" \
            /tmp/sec-env-g4.log || {
              echo "SEC_ENV_G4_HARNESS_FAIL: exact target-green sentinel missing"
              exit 1
            }

          for unexpected in \
            SEC_ENV_G4_E1_EXPECTED_RED \
            SEC_ENV_G4_E2_EXPECTED_RED \
            SEC_ENV_G4_E3_EXPECTED_RED \
            SEC_ENV_G4_E4_EXPECTED_RED \
            SEC_ENV_G4_E5_EXPECTED_RED \
            SEC_ENV_G4_E6_EXPECTED_RED \
            SEC_ENV_G4_E7_EXPECTED_RED \
            SEC_ENV_G4_E8_EXPECTED_RED \
            SEC_ENV_G4_E9_EXPECTED_RED \
            SEC_ENV_G4_E10_EXPECTED_RED
          do
            if grep -Fq "$unexpected" /tmp/sec-env-g4.log; then
              echo "SEC_ENV_G4_HARNESS_FAIL: stale expected-red sentinel present: $unexpected"
              exit 1
            fi
          done

          echo "SEC_ENV_G4_TARGET_GREEN_CONFIRMED"

      - name: Independently prove visual smoke cannot target production
        shell: bash
        run: |
          set -euo pipefail

          set +e
          env -u MONGEZZ_DEPLOY_TARGET -u MONGEZZ_VISUAL_TEST_BASE_URL \
            python3 tests/visual/mobile-rtl-smoke.py --preflight-only \
            > /tmp/visual-missing.log 2>&1
          missing_status=$?

          MONGEZZ_DEPLOY_TARGET=preview \
          MONGEZZ_VISUAL_TEST_BASE_URL=https://simple-store-aid.lovable.app \
            python3 tests/visual/mobile-rtl-smoke.py --preflight-only \
            > /tmp/visual-production-app.log 2>&1
          production_app_status=$?

          MONGEZZ_DEPLOY_TARGET=preview \
          MONGEZZ_VISUAL_TEST_BASE_URL=https://dahzkekdirrngnkcxinv.supabase.co \
            python3 tests/visual/mobile-rtl-smoke.py --preflight-only \
            > /tmp/visual-production-supabase.log 2>&1
          production_supabase_status=$?

          MONGEZZ_DEPLOY_TARGET=preview \
          MONGEZZ_VISUAL_TEST_BASE_URL=https://simple-store-aid。lovable.app \
            python3 tests/visual/mobile-rtl-smoke.py --preflight-only \
            > /tmp/visual-unicode-production.log 2>&1
          unicode_status=$?

          MONGEZZ_DEPLOY_TARGET=preview \
          MONGEZZ_VISUAL_TEST_BASE_URL='https://simple-store-aid.lovable.app\preview.example' \
            python3 tests/visual/mobile-rtl-smoke.py --preflight-only \
            > /tmp/visual-backslash-production.log 2>&1
          backslash_status=$?
          set -e

          MONGEZZ_DEPLOY_TARGET=ci \
          MONGEZZ_VISUAL_TEST_BASE_URL=http://127.0.0.1:8080 \
            python3 tests/visual/mobile-rtl-smoke.py --preflight-only \
            > /tmp/visual-safe.log 2>&1

          if [[ "$missing_status" -eq 0 ]] || \
             ! grep -Fq "SEC_ENV_VISUAL_SMOKE_BLOCKED" /tmp/visual-missing.log; then
            echo "SEC_ENV_VISUAL_HARNESS_FAIL: missing target/base URL did not fail closed"
            exit 1
          fi

          if [[ "$production_app_status" -eq 0 ]] || \
             ! grep -Fq "SEC_ENV_VISUAL_SMOKE_BLOCKED" /tmp/visual-production-app.log; then
            echo "SEC_ENV_VISUAL_HARNESS_FAIL: production app host was accepted"
            exit 1
          fi

          if [[ "$production_supabase_status" -eq 0 ]] || \
             ! grep -Fq "SEC_ENV_VISUAL_SMOKE_BLOCKED" /tmp/visual-production-supabase.log; then
            echo "SEC_ENV_VISUAL_HARNESS_FAIL: production Supabase host was accepted"
            exit 1
          fi

          if [[ "$unicode_status" -eq 0 ]] || \
             ! grep -Fq "SEC_ENV_VISUAL_SMOKE_BLOCKED" /tmp/visual-unicode-production.log; then
            echo "SEC_ENV_VISUAL_HARNESS_FAIL: browser-equivalent Unicode production hostname was accepted"
            exit 1
          fi

          if [[ "$backslash_status" -eq 0 ]] || \
             ! grep -Fq "SEC_ENV_VISUAL_SMOKE_BLOCKED" /tmp/visual-backslash-production.log; then
            echo "SEC_ENV_VISUAL_HARNESS_FAIL: browser-ambiguous backslash production URL was accepted"
            exit 1
          fi

          grep -Fq \
            "SEC_ENV_VISUAL_SMOKE_PREFLIGHT_OK: explicit non-production visual target verified" \
            /tmp/visual-safe.log || {
              echo "SEC_ENV_VISUAL_HARNESS_FAIL: isolated CI visual target was rejected"
              exit 1
            }

          echo "SEC_ENV_VISUAL_HARNESS_CONFIRMED"
