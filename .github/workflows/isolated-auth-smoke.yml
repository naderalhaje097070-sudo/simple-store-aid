name: Isolated Auth UI Smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  authenticated-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Verify Supabase CLI version
        shell: bash
        run: |
          set -euo pipefail
          actual="$(supabase --version)"
          test "$actual" = "2.101.0"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start isolated Supabase and export environment
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            echo "SEC_CI_INFRA_FAIL: isolated Supabase failed to start; raw startup output withheld"
            exit 1
          fi

          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a

          case "$API_URL" in
            http://127.0.0.1:54321|http://localhost:54321) ;;
            *)
              echo "SEC_CI_ISOLATION_FAIL: API_URL is not the approved loopback target"
              exit 1
              ;;
          esac

          case "$DB_URL" in
            postgresql://*@127.0.0.1:54322/*|postgresql://*@localhost:54322/*|postgres://*@127.0.0.1:54322/*|postgres://*@localhost:54322/*) ;;
            *)
              echo "SEC_CI_ISOLATION_FAIL: DB_URL is not the approved loopback target"
              exit 1
              ;;
          esac

          echo "::add-mask::$ANON_KEY"
          if [[ -n "${SERVICE_ROLE_KEY:-}" ]]; then
            echo "::add-mask::$SERVICE_ROLE_KEY"
          fi
          echo "::add-mask::$DB_URL"

          {
            echo "MONGEZZ_DEPLOY_TARGET=ci"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_PROJECT_ID=local-ci"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_PROJECT_ID=local-ci"
            echo "DB_URL=$DB_URL"
            echo "CI_ISOLATED_SUPABASE=1"
            echo "APP_BASE_URL=http://127.0.0.1:8080"
          } >> "$GITHUB_ENV"

      - name: Create confirmed isolated QA account
        shell: bash
        run: |
          set -euo pipefail
          test "${CI_ISOLATED_SUPABASE:-}" = "1"
          test "${MONGEZZ_DEPLOY_TARGET:-}" = "ci"
          email="pilot.qa.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}@example.test"
          password="Pilot-QA-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}!"
          echo "::add-mask::$password"
          signup="$(curl --fail-with-body --silent --show-error \
            -X POST "$VITE_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\",\"data\":{\"display_name\":\"Pilot QA\"}}")"
          user_id="$(jq -r '.user.id // .id // empty' <<< "$signup")"
          test -n "$user_id"
          tenant_id="11111111-1111-4111-8111-111111111111"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v uid="$user_id" -v tid="$tenant_id" <<'SQL'
          UPDATE auth.users
             SET email_confirmed_at = COALESCE(email_confirmed_at, now()),
                 updated_at = now()
           WHERE id = :'uid'::uuid;

          INSERT INTO public.tenants (id, name, owner_user_id)
          VALUES (:'tid'::uuid, 'Pilot QA Tenant', :'uid'::uuid)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.profiles (id, tenant_id, display_name)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'Pilot QA')
          ON CONFLICT (id) DO UPDATE
          SET tenant_id = EXCLUDED.tenant_id,
              display_name = EXCLUDED.display_name;

          INSERT INTO public.user_roles (user_id, tenant_id, role)
          VALUES (:'uid'::uuid, :'tid'::uuid, 'owner')
          ON CONFLICT DO NOTHING;
          SQL
          {
            echo "PILOT_QA_EMAIL=$email"
            echo "PILOT_QA_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Build production application against isolated Supabase
        run: bun run build

      - name: Start Cloudflare production emulator
        shell: bash
        run: |
          set -euo pipefail
          find .output -maxdepth 4 -type f | sort | tee /tmp/build-files.log
          test -f .output/server/wrangler.json

          set -a
          source /tmp/supabase.env
          set +a
          cat > /tmp/mongezz-worker.env <<EOF
          MONGEZZ_DEPLOY_TARGET=ci
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY
          VITE_SUPABASE_PROJECT_ID=$VITE_SUPABASE_PROJECT_ID
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_PROJECT_ID=$SUPABASE_PROJECT_ID
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF
          chmod 600 /tmp/mongezz-worker.env

          nohup bunx wrangler dev --config .output/server/wrangler.json --env-file /tmp/mongezz-worker.env --compatibility-date 2026-08-08 --ip 127.0.0.1 --port 8080 > /tmp/mongezz-app.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "SEC_CI_APP_FAIL: local production emulator did not become ready; raw application log retained only as CI artifact"
          exit 1

      - name: Install Playwright
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Run read-only authenticated smoke
        run: python3 tests/e2e/isolated-auth-smoke.py

      - name: Write concise CI summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Isolated Auth UI Smoke"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Status: **${JOB_STATUS}**"
            echo "- Supabase CLI: \`2.101.0\`"
            echo "- Deploy target: \`ci\`"
            echo "- Environment: isolated loopback Supabase + local Cloudflare emulator"
            echo "- Production database accessed: **No**"
            echo "- Raw Supabase environment/startup output published: **No**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-auth-ui-smoke
          path: |
            /tmp/mongezz-auth-smoke
            /tmp/mongezz-app.log
            /tmp/build-files.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop isolated Supabase
        if: always()
        shell: bash
        run: |
          rm -f /tmp/mongezz-worker.env
          supabase stop --no-backup > /dev/null 2>&1 || true
