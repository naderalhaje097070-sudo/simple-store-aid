name: B4 signed webhook persistence
on:
  push:
    branches: ['integration/g0-g1-reconcile-2026-10-18']
    paths:
      - '.github/workflows/b4-webhook-persistence.yml'
      - 'tests/account-lifecycle/webhook*'
      - 'src/lib/subscription-webhook.server.ts'
      - 'src/routes/api/public/payments/webhook.ts'
      - 'changes/b4-app02/WEBHOOK_PERSISTENCE.sql'
      - 'supabase/migrations/*_webhook_persistence_01.sql'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v2
        with:
          version: '2.101.0'
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = '2.101.0'
          supabase migration new --help > "$RUNNER_TEMP/migration-new-help.txt"
          supabase migration up --help > "$RUNNER_TEMP/migration-up-help.txt"
          grep -q -- '--local' "$RUNNER_TEMP/migration-up-help.txt"
          count="$(find supabase/migrations -name '*_webhook_persistence_01.sql' | wc -l)"
          if [[ "$count" == 0 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            work="$RUNNER_TEMP/app02-generator"
            mkdir -p "$work"
            supabase --workdir "$work" init > "$RUNNER_TEMP/generator-init.log" 2>&1
            supabase --workdir "$work" migration new webhook_persistence_01 > "$RUNNER_TEMP/generator-new.log" 2>&1
            generated="$(find "$work/supabase/migrations" -name '*_webhook_persistence_01.sql')"
            test -n "$generated"
            cp changes/b4-app02/WEBHOOK_PERSISTENCE.sql "$generated"
            mkdir -p "$RUNNER_TEMP/generated-migration"
            cp "$generated" "$RUNNER_TEMP/generated-migration/"
            GENERATED_FILE="$generated" python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['GENERATED_FILE'])
          r={'filename':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'cli':'2.101.0',
             'command':'supabase migration new webhook_persistence_01','source':os.environ['GITHUB_SHA'],'database_started':False}
          (Path(os.environ['RUNNER_TEMP'])/'generated-migration/generator.json').write_text(json.dumps(r,indent=2)+'\n')
          print('APP02_GENERATOR '+json.dumps(r))
          PY
          elif [[ "$count" == 1 ]]; then
            cmp changes/b4-app02/WEBHOOK_PERSISTENCE.sql supabase/migrations/*_webhook_persistence_01.sql
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            exit 2
          fi
      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.ready == 'false'
        with:
          name: b4-cli-generated-migration
          path: ${{ runner.temp }}/generated-migration/
          retention-days: 7
  persistence:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, upgrade]
    env:
      EXPECTED_SOURCE: ${{ github.sha }}
      CONTRACT_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.14'
      - name: Frozen install and signed handler controls
        run: |
          bun install --frozen-lockfile
          node --test tests/account-lifecycle/webhook_handler.test.cjs
      - uses: supabase/setup-cli@v2
        with:
          version: '2.101.0'
      - name: Discover pinned CLI operations
        run: |
          set -euo pipefail
          test "$(supabase --version)" = '2.101.0'
          supabase start --help > "$RUNNER_TEMP/start-help.txt"
          supabase stop --help > "$RUNNER_TEMP/stop-help.txt"
          supabase migration up --help > "$RUNNER_TEMP/up-help.txt"
          supabase db advisors --help > "$RUNNER_TEMP/advisors-help.txt"
          supabase migration list --help > "$RUNNER_TEMP/list-help.txt"
          grep -q -- '--local' "$RUNNER_TEMP/up-help.txt"
          grep -q -- '--no-backup' "$RUNNER_TEMP/stop-help.txt"
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client iptables > "$RUNNER_TEMP/prerequisites.log" 2>&1
      - name: Restrict probe UID before credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin app02
          uid="$(id -u app02)"
          sudo iptables -N APP02
          sudo iptables -A APP02 -o lo -d 127.0.0.1/32 -p tcp -m multiport --dports 54321,54322 -j ACCEPT
          sudo iptables -A APP02 -j REJECT --reject-with icmp-port-unreachable
          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$uid" -j APP02
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner "$uid" -j REJECT
          sudo -u app02 "$(command -v python)" - <<'PY'
          import socket
          try:
              with socket.create_connection(('1.1.1.1',443),timeout=3): pass
          except OSError:
              print('APP02_CREDENTIAL_FREE_EGRESS_REJECTED')
          else:
              raise SystemExit('APP02_FIREWALL_FAILED')
          PY
          sudo install -d -m 711 -o app02 -g app02 /tmp/monjez-app02
          sudo cp -a "$GITHUB_WORKSPACE/." /tmp/monjez-app02/repo
          sudo install -d -m 700 -o app02 -g app02 /tmp/monjez-app02/evidence
          sudo chown -R app02:app02 /tmp/monjez-app02
          sudo iptables -nvxL APP02 > "$RUNNER_TEMP/firewall-before.txt"
      - name: Start disposable full chain
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stack="$RUNNER_TEMP/monjez-app02-stack"
          mkdir -p "$stack"
          supabase --workdir "$stack" init > "$RUNNER_TEMP/init-private.log" 2>&1
          mkdir -p "$stack/supabase/migrations"
          cp supabase/migrations/*.sql "$stack/supabase/migrations/"
          if [[ "$CONTRACT_MODE" == upgrade ]]; then
            rm "$stack"/supabase/migrations/*_webhook_persistence_01.sql
          fi
          if ! supabase --workdir "$stack" start > "$RUNNER_TEMP/start-private.log" 2>&1; then
            echo 'APP02_STACK_START_FAILURE_PRIVATE_LOG_WITHHELD'
            exit 1
          fi
          supabase --workdir "$stack" status -o json > "$RUNNER_TEMP/status-private.json"
          sudo install -m 600 -o app02 -g app02 "$RUNNER_TEMP/status-private.json" /tmp/monjez-app02/status.json
      - name: Baseline then populated local upgrade
        if: matrix.mode == 'upgrade'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monjez-app02/repo
          sudo -u app02 env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 \
            EXPECTED_SOURCE="$EXPECTED_SOURCE" MONGEZZ_DEPLOY_TARGET=ci MONGEZZ_E2E_WRITE_TEST=1 CI_ISOLATED_SUPABASE=1 \
            VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY=app02-preflight-placeholder \
            PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres \
            python tests/account-lifecycle/webhook_persistence_probe.py --expected-source "$EXPECTED_SOURCE" \
              --status-file /tmp/monjez-app02/status.json --evidence-dir /tmp/monjez-app02/evidence \
              --private-state /tmp/monjez-app02/private-state.json --phase before
          cp supabase/migrations/*_webhook_persistence_01.sql "$RUNNER_TEMP/monjez-app02-stack/supabase/migrations/"
          supabase --workdir "$RUNNER_TEMP/monjez-app02-stack" migration up --local > "$RUNNER_TEMP/upgrade-private.log" 2>&1
      - name: Actual authorization and invariance
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monjez-app02/repo
          sudo -u app02 env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 \
            EXPECTED_SOURCE="$EXPECTED_SOURCE" MONGEZZ_DEPLOY_TARGET=ci MONGEZZ_E2E_WRITE_TEST=1 CI_ISOLATED_SUPABASE=1 \
            VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY=app02-preflight-placeholder \
            PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres PGPASSWORD=postgres \
            python tests/account-lifecycle/webhook_persistence_probe.py --expected-source "$EXPECTED_SOURCE" \
              --status-file /tmp/monjez-app02/status.json --evidence-dir /tmp/monjez-app02/evidence \
              --private-state /tmp/monjez-app02/private-state.json --phase after
      - name: Runtime image identity
        shell: bash
        run: |
          set -euo pipefail
          docker ps --format '{{.Image}}' | sort -u > "$RUNNER_TEMP/runtime-images.txt"
          sudo install -m 600 -o app02 -g app02 "$RUNNER_TEMP/runtime-images.txt" /tmp/monjez-app02/evidence/runtime-images.txt
      - name: Local migration history and advisor availability
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "$RUNNER_TEMP/monjez-app02-stack" migration list --local > "$RUNNER_TEMP/migrations.txt"
          sudo install -m 600 -o app02 -g app02 "$RUNNER_TEMP/migrations.txt" /tmp/monjez-app02/evidence/migrations.txt
          if grep -q -- '--local' "$RUNNER_TEMP/advisors-help.txt"; then
            supabase --workdir "$RUNNER_TEMP/monjez-app02-stack" db advisors --local > "$RUNNER_TEMP/advisors-private.txt" 2>&1
            sudo install -m 600 -o app02 -g app02 "$RUNNER_TEMP/advisors-private.txt" /tmp/monjez-app02/evidence/advisors.txt
          else
            echo 'APP02_OFFICIAL_ADVISOR_LOCAL_MODE_UNAVAILABLE_NO_REMOTE_FALLBACK'
            echo 'local advisor unavailable; no remote fallback' | sudo -u app02 tee /tmp/monjez-app02/evidence/advisors-unavailable.txt
          fi
      - name: Cleanup and safe final receipts
        id: publication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/app02-evidence"
          mkdir -p "$out"
          if [[ -d /tmp/monjez-app02/evidence ]]; then
            sudo cp -a /tmp/monjez-app02/evidence/. "$out/"
            sudo chown -R "$(id -un):$(id -gn)" "$out"
          fi
          rm -f "$RUNNER_TEMP/status-private.json" "$RUNNER_TEMP/start-private.log"
          if [[ -d "$RUNNER_TEMP/monjez-app02-stack/supabase" ]]; then
            supabase --workdir "$RUNNER_TEMP/monjez-app02-stack" stop --no-backup > "$RUNNER_TEMP/stop-private.log" 2>&1
          fi
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);out=root/'app02-evidence'
          def rejects(path):
              return sum(int(x.split()[0]) for x in path.splitlines() if 'REJECT' in x)
          before=rejects((root/'firewall-before.txt').read_text())
          after=rejects(subprocess.check_output(['sudo','iptables','-nvxL','APP02'],text=True))
          uid=subprocess.check_output(['id','-u','app02'],text=True).strip()
          v6=sum(int(x.split()[0]) for x in subprocess.check_output(['sudo','ip6tables','-nvxL','OUTPUT'],text=True).splitlines()
                 if 'REJECT' in x and ('owner UID match '+uid) in x)
          cleanup={'source':os.environ['EXPECTED_SOURCE'],'credential_free_canary_rejected':before>0,
                   'unexpected_ipv4_rejects':after-before,'ipv6_rejects':v6,
                   'status_removed':not Path('/tmp/monjez-app02/status.json').exists(),
                   'state_removed':not Path('/tmp/monjez-app02/private-state.json').exists(),
                   'stack_removed':'monjez-app02-stack' not in subprocess.check_output(['docker','ps','--format','{{.Names}}'],text=True)}
          (out/'cleanup.json').write_text(json.dumps(cleanup,indent=2)+'\n')
          sys.path.insert(0,'tests/account-lifecycle')
          from scanner_evidence import verify_publication, PublicationBlocked
          forbidden=[]
          for filename in ['status.json','private-state.json']:
              p=Path('/tmp/monjez-app02')/filename
              if p.exists():
                  raw=subprocess.check_output(['sudo','cat',str(p)],text=True)
                  data=json.loads(raw)
                  if filename=='status.json':
                      forbidden += [v for k,v in data.items() if 'KEY' in k or 'PASSWORD' in k]
                  else:
                      forbidden += [v for actor in data.get('actors',{}).values() for k,v in actor.items()
                                    if k in ('token','refresh','password','email')]
          try:
              verify_publication(out,root/'app02-private-quarantine',forbidden)
          except PublicationBlocked:
              print('APP02_PUBLICATION_BLOCKED '+(out/'publication-blocked.json').read_text())
              raise
          finally:
              subprocess.run(['sudo','rm','-f','/tmp/monjez-app02/status.json','/tmp/monjez-app02/private-state.json'],check=True)
          cleanup['status_removed']=not Path('/tmp/monjez-app02/status.json').exists()
          cleanup['state_removed']=not Path('/tmp/monjez-app02/private-state.json').exists()
          (out/'cleanup.json').write_text(json.dumps(cleanup,indent=2)+'\n')
          print('APP02_CLEANUP '+json.dumps(cleanup))
          assert before>0 and after==before and v6==0 and cleanup['status_removed'] and cleanup['state_removed'] and cleanup['stack_removed']
          PY
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.publication.outputs.safe == 'true'
        with:
          name: b4-webhook-${{ matrix.mode }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/app02-evidence/
          retention-days: 7
